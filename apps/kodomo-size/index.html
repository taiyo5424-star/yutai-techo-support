<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#34a877">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="子ども服のサイズやお下がりの在庫を管理。買い物やお下がりの把握に。">
<title>こども服サイズ帳｜サイズとお下がり管理</title>
<style>
  :root{
    --accent:#34a877; --accent-d:#298a61; --accent-soft:#e9f6f0;
    --bg:#faf7f5; --card:#ffffff; --text:#2b2622; --sub:#8a827b;
    --line:#eee6e0; --ok:#3fa66a; --warn:#e0952b; --danger:#d9534f;
    --radius:16px; --shadow:0 2px 12px rgba(80,60,50,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#18140f; --card:#241e18; --text:#f2ece6; --sub:#a89f96;
      --line:#372f27; --accent-soft:#173327; --shadow:0 2px 12px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;
    padding-bottom:env(safe-area-inset-bottom);-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--accent),var(--accent-d));
    color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));
    display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  header .ico{font-size:24px;line-height:1}
  header h1{font-size:18px;margin:0;font-weight:700;flex:1}
  header button.gear{background:rgba(255,255,255,.2);border:0;color:#fff;font-size:18px;
    width:36px;height:36px;border-radius:50%;cursor:pointer}
  main{max-width:640px;margin:0 auto;padding:16px 16px 28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  h2{font-size:15px;margin:0 0 12px;color:var(--sub);font-weight:700;letter-spacing:.02em}
  .btn{appearance:none;border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:transform .05s,filter .15s;width:100%}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{filter:brightness(1.05)}
  .btn-ghost{background:var(--accent-soft);color:var(--accent-d)}
  .btn-sm{width:auto;padding:8px 14px;font-size:14px;border-radius:10px}
  label{display:block;font-size:13px;color:var(--sub);font-weight:600;margin:0 0 4px}
  input,select,textarea{font-family:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);color:var(--text);width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
  .row{display:flex;gap:8px;align-items:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field{margin-bottom:10px}
  .summary{display:flex;gap:10px;margin-bottom:14px}
  .stat{flex:1;background:var(--accent-soft);border-radius:var(--radius);padding:14px 10px;text-align:center}
  .stat .num{font-size:28px;font-weight:800;color:var(--accent-d);line-height:1.1}
  .stat .lbl{font-size:12px;color:var(--sub);margin-top:2px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:20px;
    padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  ul.list{list-style:none;margin:0;padding:0}
  ul.list li{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
  ul.list li:last-child{border-bottom:0}
  ul.list li .body{flex:1;min-width:0}
  ul.list li .name{word-break:break-word;font-weight:600}
  ul.list li .meta{font-size:12px;color:var(--sub);margin-top:2px}
  .sz{display:inline-block;font-weight:800;color:var(--accent-d);font-size:17px;min-width:44px}
  .tag{font-size:11px;color:var(--sub);background:var(--bg);padding:2px 8px;border-radius:20px;margin-left:6px}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
  .badge.now{background:var(--accent-soft);color:var(--accent-d)}
  .badge.keep{background:#fff3e0;color:#b9741a}
  .badge.wait{background:#eef1f4;color:#6b7480}
  @media (prefers-color-scheme: dark){
    .badge.keep{background:#3a2c17;color:#e0a24a}
    .badge.wait{background:#2a2f36;color:#a9b3bd}
  }
  .del{background:none;border:0;color:var(--danger);font-size:18px;cursor:pointer;padding:4px 8px}
  .empty{text-align:center;color:var(--sub);padding:20px 8px;font-size:14px}
  .ad-slot{margin:16px auto;max-width:640px;min-height:56px;border:1px dashed var(--line);border-radius:12px;
    display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px;background:var(--card)}
  footer{max-width:640px;margin:0 auto;padding:18px 16px 34px;color:var(--sub);font-size:12px;text-align:center}
  footer a{color:var(--sub)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal.open{display:flex}
  .sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
  .sheet h3{margin:0 0 12px;font-size:17px}
  .sheet .btn{margin-top:8px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#2b2622;color:#fff;
    padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <span class="ico">👕</span>
  <h1>こども服サイズ帳</h1>
  <button class="gear" id="gear" aria-label="設定">⚙️</button>
</header>

<main>
  <div class="summary">
    <div class="stat">
      <div class="num" id="statNow">0</div>
      <div class="lbl">今着ている</div>
    </div>
    <div class="stat">
      <div class="num" id="statKeep">0</div>
      <div class="lbl">お下がり保管中</div>
    </div>
    <div class="stat">
      <div class="num" id="statWait">0</div>
      <div class="lbl">おさがり待ち</div>
    </div>
  </div>

  <div class="ad-slot"><!-- AdMob等の広告をここに表示 -->広告スペース</div>

  <div class="card">
    <h2>服を記録する</h2>
    <form id="addForm" autocomplete="off">
      <div class="grid2">
        <div class="field">
          <label for="child">子どもの名前（任意）</label>
          <input id="child" list="childList" placeholder="例：はると" maxlength="20">
          <datalist id="childList"></datalist>
        </div>
        <div class="field">
          <label for="type">アイテム種別</label>
          <select id="type">
            <option>トップス</option><option>ボトムス</option><option>アウター</option>
            <option>靴</option><option>下着</option><option>その他</option>
          </select>
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="size">サイズ（例：100）</label>
          <input id="size" placeholder="100" maxlength="12" required>
        </div>
        <div class="field">
          <label for="season">季節（任意）</label>
          <select id="season">
            <option value="">指定なし</option>
            <option>春夏</option><option>秋冬</option><option>通年</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="status">状態</label>
        <select id="status">
          <option value="now">今着ている</option>
          <option value="keep">お下がり保管中</option>
          <option value="wait">おさがり待ち</option>
        </select>
      </div>
      <button class="btn btn-primary" type="submit">追加する</button>
    </form>
  </div>

  <div class="card">
    <h2>絞り込み</h2>
    <div style="font-size:12px;color:var(--sub);margin-bottom:6px">子どもで絞る</div>
    <div class="chips" id="childChips"></div>
    <div style="font-size:12px;color:var(--sub);margin:8px 0 6px">状態で絞る</div>
    <div class="chips" id="statusChips">
      <button class="chip on" data-status="all">すべて</button>
      <button class="chip" data-status="now">今着ている</button>
      <button class="chip" data-status="keep">お下がり保管中</button>
      <button class="chip" data-status="wait">おさがり待ち</button>
    </div>
  </div>

  <div class="card">
    <h2>一覧（<span id="count">0</span>件）</h2>
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty">まだ登録がありません。上のフォームからお子さんの服のサイズを記録しましょう。買い物中の「今のサイズ確認」やお下がりの在庫管理に役立ちます。</p>
  </div>
</main>

<footer>
  <p>データはこの端末内にのみ保存されます。外部送信はありません。</p>
  <p><a href="../../privacy-kodomo-size.html">プライバシーポリシー</a>　|　<a href="../index.html">アプリ一覧</a></p>
  <p>© こども服サイズ帳</p>
</footer>

<div class="modal" id="modal">
  <div class="sheet">
    <h3>設定</h3>
    <button class="btn btn-ghost" id="export">データを書き出す（バックアップ）</button>
    <button class="btn btn-ghost" id="closeModal">閉じる</button>
    <button class="btn" id="clear" style="background:var(--danger);color:#fff">すべてのデータを削除</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var KEY="kodomo-size";
  // ---- storage helper (shared pattern across all apps) ----
  var store={
    get:function(k,d){ try{var v=localStorage.getItem(KEY+":"+k);return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set:function(k,v){ try{localStorage.setItem(KEY+":"+k,JSON.stringify(v));}catch(e){} },
    del:function(){ try{Object.keys(localStorage).forEach(function(x){if(x.indexOf(KEY+":")===0)localStorage.removeItem(x);});}catch(e){} }
  };
  function $(s){return document.querySelector(s);}
  function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show");},1800);}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  var STATUS={ now:{label:"今着ている",cls:"now"}, keep:{label:"お下がり保管中",cls:"keep"}, wait:{label:"おさがり待ち",cls:"wait"} };
  var items=store.get("items",[]);   // {id,child,type,size,season,status}
  var filterChild=store.get("fChild","all");
  var filterStatus="all";

  function save(){ store.set("items",items); store.set("fChild",filterChild); }

  function children(){
    var seen={}, out=[];
    items.forEach(function(it){ var c=(it.child||"").trim(); if(c&&!seen[c]){seen[c]=1;out.push(c);} });
    return out;
  }

  function render(){
    // stats
    var n=0,k=0,w=0;
    items.forEach(function(it){ if(it.status==="now")n++; else if(it.status==="keep")k++; else if(it.status==="wait")w++; });
    $("#statNow").textContent=n; $("#statKeep").textContent=k; $("#statWait").textContent=w;

    // child datalist
    var kids=children();
    $("#childList").innerHTML=kids.map(function(c){return '<option value="'+esc(c)+'">';}).join("");

    // child filter chips
    var chips='<button class="chip'+(filterChild==="all"?" on":"")+'" data-child="all">すべて</button>';
    kids.forEach(function(c){ chips+='<button class="chip'+(filterChild===c?" on":"")+'" data-child="'+esc(c)+'">'+esc(c)+'</button>'; });
    $("#childChips").innerHTML=chips;

    // status chips active state
    Array.prototype.forEach.call(document.querySelectorAll("#statusChips .chip"),function(b){
      b.classList.toggle("on", b.getAttribute("data-status")===filterStatus);
    });

    // filtered list
    var view=items.filter(function(it){
      if(filterChild!=="all" && (it.child||"")!==filterChild) return false;
      if(filterStatus!=="all" && it.status!==filterStatus) return false;
      return true;
    });
    $("#count").textContent=view.length;
    var empty=$("#empty");
    empty.style.display=view.length?"none":"block";
    if(!view.length && items.length){ empty.textContent="条件に合う服がありません。絞り込みを変えてみてください。"; }
    else{ empty.textContent="まだ登録がありません。上のフォームからお子さんの服のサイズを記録しましょう。買い物中の「今のサイズ確認」やお下がりの在庫管理に役立ちます。"; }

    $("#list").innerHTML=view.map(function(it){
      var st=STATUS[it.status]||STATUS.now;
      var meta=[];
      if(it.child) meta.push(esc(it.child));
      meta.push(esc(it.type));
      if(it.season) meta.push(esc(it.season));
      return '<li data-id="'+it.id+'">'+
        '<span class="sz">'+esc(it.size)+'</span>'+
        '<div class="body">'+
          '<div class="name">'+esc(it.type)+(it.child?' <span class="tag">'+esc(it.child)+'</span>':'')+'</div>'+
          '<div class="meta"><span class="badge '+st.cls+'">'+st.label+'</span>'+(it.season?' ・ '+esc(it.season):'')+'</div>'+
        '</div>'+
        '<button class="del" aria-label="削除">🗑</button></li>';
    }).join("");
  }

  // add
  $("#addForm").addEventListener("submit",function(e){
    e.preventDefault();
    var size=$("#size").value.trim(); if(!size){ toast("サイズを入力してください"); return; }
    items.unshift({
      id:Date.now()+"-"+Math.floor(performance.now()),
      child:$("#child").value.trim(),
      type:$("#type").value,
      size:size,
      season:$("#season").value,
      status:$("#status").value
    });
    save();
    $("#size").value="";
    render(); toast("追加しました");
  });

  // delete
  $("#list").addEventListener("click",function(e){
    if(!e.target.classList.contains("del"))return;
    var id=e.target.closest("li").getAttribute("data-id");
    items=items.filter(function(i){return String(i.id)!==String(id);});
    save(); render();
  });

  // child filter
  $("#childChips").addEventListener("click",function(e){
    var b=e.target.closest(".chip"); if(!b)return;
    filterChild=b.getAttribute("data-child"); save(); render();
  });
  // status filter
  $("#statusChips").addEventListener("click",function(e){
    var b=e.target.closest(".chip"); if(!b)return;
    filterStatus=b.getAttribute("data-status"); render();
  });

  // settings modal
  $("#gear").addEventListener("click",function(){$("#modal").classList.add("open");});
  $("#closeModal").addEventListener("click",function(){$("#modal").classList.remove("open");});
  $("#modal").addEventListener("click",function(e){if(e.target===this)this.classList.remove("open");});
  $("#export").addEventListener("click",function(){
    var data=JSON.stringify({items:items},null,2);
    try{
      var b=new Blob([data],{type:"application/json"});
      var a=document.createElement("a");a.href=URL.createObjectURL(b);
      a.download="kodomo-size-backup.json";a.click();
    }catch(e){ prompt("以下をコピーして保存してください",data); }
  });
  $("#clear").addEventListener("click",function(){
    if(confirm("すべての記録を削除します。よろしいですか？")){
      store.del(); items=[]; filterChild="all"; filterStatus="all";
      render(); $("#modal").classList.remove("open"); toast("削除しました");
    }
  });

  render();
})();
</script>
</body>
</html>
