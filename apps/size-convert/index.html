<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サイズ換算メモ</title>
<meta name="description" content="靴・服の日本/US/EU/UKサイズをすばやく換算できるリファレンス。マイサイズを登録して買い物に。会員登録不要・完全ローカル保存。">
<meta name="theme-color" content="#8b5cf6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="サイズ">
<style>
  :root{
    --accent:#8b5cf6; --accent2:#7c3aed;
    --bg:#f4f6f8; --surface:#ffffff; --surface2:#f8fafc;
    --text:#0f172a; --muted:#64748b; --line:#e6e9ee; --empty:#eceff3;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
    --danger:#ef4444;
    --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1220; --surface:#131c2b; --surface2:#0f1826;
      --text:#e7ecf3; --muted:#94a3b8; --line:#25324a; --empty:#1b2536;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;color:inherit;cursor:pointer}
  .app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px calc(28px + var(--safe-b))}
  /* header */
  header{
    position:sticky;top:0;z-index:20;background:var(--bg);
    padding:calc(12px + var(--safe-t)) 0 10px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .logo{width:34px;height:34px;border-radius:9px;flex:0 0 auto;box-shadow:0 2px 6px rgba(124,58,237,.35)}
  .brand h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.01em;white-space:nowrap}
  .icon-btn{
    width:44px;height:44px;border:none;border-radius:12px;background:var(--surface);
    box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px;flex:0 0 auto
  }
  .icon-btn:active{transform:scale(.94)}
  /* segmented category switch */
  .seg{
    display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:4px;margin:4px 0 14px;box-shadow:var(--shadow)
  }
  .seg button{
    flex:1;border:none;background:transparent;border-radius:10px;padding:11px 3px;
    font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;letter-spacing:-.01em
  }
  .seg button.on{
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
    box-shadow:0 4px 12px rgba(124,58,237,.35)
  }
  .seg button:active{transform:scale(.97)}
  /* conversion table */
  .tbl-wrap{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px
  }
  .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.conv{width:100%;border-collapse:collapse;font-size:14px}
  table.conv th,table.conv td{padding:13px 8px;text-align:center;white-space:nowrap}
  table.conv thead th{
    font-size:11px;font-weight:800;color:var(--muted);background:var(--surface2);
    border-bottom:1px solid var(--line);letter-spacing:.02em
  }
  table.conv tbody tr{border-bottom:1px solid var(--line)}
  table.conv tbody tr:last-child{border-bottom:none}
  table.conv tbody td:first-child{font-weight:800}
  table.conv tbody tr:active{background:var(--empty)}
  table.conv tbody tr.sel td{background:var(--accent);color:#fff;font-weight:800}
  table.conv tbody tr.sel td:first-child{color:#fff}
  /* selected info + save */
  .selinfo{font-size:12.5px;color:var(--muted);font-weight:600;text-align:center;margin:0 0 10px;min-height:18px}
  .selinfo b{color:var(--accent)}
  .save-btn{
    width:100%;border:none;border-radius:14px;padding:15px;font-size:15.5px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 8px 20px rgba(124,58,237,.35);display:flex;align-items:center;justify-content:center;gap:8px
  }
  .save-btn:disabled{background:var(--empty);color:var(--muted);box-shadow:none}
  .save-btn:active:not(:disabled){transform:scale(.98)}
  /* section title */
  .sec-title{font-size:13px;font-weight:800;color:var(--muted);margin:22px 2px 12px;display:flex;align-items:center;gap:6px}
  /* my sizes */
  .mine-item{
    display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:12px 12px 12px 14px;margin-bottom:10px;box-shadow:var(--shadow)
  }
  .mine-lb{
    flex:0 0 auto;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
    font-size:12px;font-weight:800;padding:7px 11px;border-radius:11px;max-width:88px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap
  }
  .mine-main{flex:1;min-width:0}
  .mine-cat{font-size:11px;font-weight:700;color:var(--muted)}
  .mine-vals{font-size:13.5px;font-weight:700;margin-top:1px;word-break:break-word;line-height:1.45}
  .del-btn{
    flex:0 0 auto;border:none;background:var(--empty);color:var(--muted);
    width:44px;height:44px;border-radius:11px;font-size:18px;display:grid;place-items:center
  }
  .del-btn:active{transform:scale(.92)}
  /* empty state */
  .empty-state{text-align:center;padding:18px 10px 6px;color:var(--muted)}
  .empty-state .em{font-size:42px}
  .empty-state h2{color:var(--text);font-size:16px;margin:8px 0 4px}
  .empty-state p{font-size:13px;margin:0 auto;max-width:290px;line-height:1.6}
  /* disclaimer */
  .note{font-size:11.5px;color:var(--muted);line-height:1.7;margin:20px 2px 0;opacity:.9}
  /* overlay + sheet */
  .overlay{
    position:fixed;inset:0;z-index:50;background:rgba(9,14,24,.5);
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .2s ease;backdrop-filter:blur(2px)
  }
  .overlay.on{opacity:1;pointer-events:auto}
  .sheet{
    width:100%;max-width:520px;background:var(--surface);
    border-radius:22px 22px 0 0;padding:8px 18px calc(20px + var(--safe-b));
    box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(20px);transition:transform .22s ease;
    max-height:92vh;overflow:auto
  }
  .overlay.on .sheet{transform:translateY(0)}
  .grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 12px}
  .sheet h3{margin:2px 0 14px;font-size:18px;font-weight:800}
  .save-preview{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
  .sp-cat{font-size:11.5px;font-weight:800;color:var(--accent);margin-bottom:3px}
  .sp-vals{font-size:14px;font-weight:700;line-height:1.5;word-break:break-word}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:7px}
  .field input[type=text]{
    width:100%;border:1.5px solid var(--line);background:var(--surface2);color:var(--text);
    border-radius:12px;padding:12px 14px;font-size:16px;outline:none
  }
  .field input[type=text]:focus{border-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
  .chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 15px;font-size:13px;font-weight:700;box-shadow:var(--shadow)}
  .chip:active{transform:scale(.96)}
  .row{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;border:none;border-radius:13px;padding:14px;font-size:15.5px;font-weight:800}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 20px rgba(124,58,237,.35)}
  .btn.ghost{background:var(--empty);color:var(--text)}
  .btn:active{transform:scale(.97)}
  .sheet .list-item{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;background:transparent;
    padding:15px 4px;font-size:15px;font-weight:600;border-bottom:1px solid var(--line)
  }
  .sheet .list-item:last-child{border-bottom:none}
  .sheet .list-item .ic{font-size:19px;width:24px;text-align:center}
  .sheet .list-item.danger{color:var(--danger)}
  .about{font-size:12.5px;color:var(--muted);line-height:1.7}
  .about a{color:var(--accent);font-weight:700;text-decoration:none}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <img class="logo" src="icon-192.png" alt="" width="34" height="34">
      <h1>サイズ換算メモ</h1>
    </div>
    <button class="icon-btn" data-act="settings" aria-label="設定">⚙️</button>
  </header>
  <main>
    <div class="seg" id="seg"></div>
    <div class="tbl-wrap"><div class="tbl-scroll"><table class="conv" id="tbl"></table></div></div>
    <div class="selinfo" id="selinfo"></div>
    <button class="save-btn" id="saveBtn" data-act="save-open" disabled>＋ このサイズを保存</button>
    <div class="sec-title">📏 マイサイズ</div>
    <div id="mine" aria-live="polite"></div>
    <p class="note">※ 表示は一般的な目安です。メーカー・ブランド・商品によって実寸は異なります。購入前に各商品のサイズ表記をご確認ください。</p>
  </main>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
  "use strict";
  var KEY = "size.v1";
  var LABELS = ["私","母","父","妻","夫","娘","息子"];

  /* ---------- reference data (目安) ---------- */
  var CATS = [
    { key:"wshoe", name:"婦人靴", cols:["JP(cm)","US","EU","UK"],
      rows:[
        ["22.0","5","35","2.5"],["22.5","5.5","35.5","3"],["23.0","6","36","3.5"],
        ["23.5","6.5","37","4"],["24.0","7","37.5","4.5"],["24.5","7.5","38","5"],
        ["25.0","8","38.5","5.5"],["25.5","8.5","39","6"]
      ] },
    { key:"mshoe", name:"紳士靴", cols:["JP(cm)","US","EU","UK"],
      rows:[
        ["24.5","6.5","39.5","6"],["25.0","7","40","6.5"],["25.5","7.5","40.5","7"],
        ["26.0","8","41.5","7.5"],["26.5","8.5","42","8"],["27.0","9","42.5","8.5"],
        ["27.5","9.5","43","9"],["28.0","10","44","9.5"],["28.5","10.5","44.5","10"]
      ] },
    { key:"wcloth", name:"レディース服", cols:["JP","国際","US","EU","UK"],
      rows:[
        ["7","XS","2","34","6"],["9","S","4","36","8"],["11","M","6","38","10"],
        ["13","L","8","40","12"],["15","LL","10","42","14"],["17","3L","12","44","16"]
      ] },
    { key:"mcloth", name:"メンズ服", cols:["JP","国際","胸囲cm","US","EU"],
      rows:[
        ["S","S","80-88","34-36","44-46"],["M","M","88-96","38-40","48-50"],
        ["L","L","96-104","42","52"],["LL","XL","104-112","44","54"],
        ["3L","XXL","112-120","46","56"]
      ] }
  ];
  function catByKey(k){ for (var i=0;i<CATS.length;i++){ if (CATS[i].key===k) return CATS[i]; } return null; }

  /* ---------- date helpers (端末ローカル) ---------- */
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }

  /* ---------- storage (マイサイズのみ) ---------- */
  var db = load();
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if (raw){ var o = JSON.parse(raw); if (o && Array.isArray(o.mine)) return o; }
    }catch(e){}
    return { version: 1, mine: [] };
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }

  /* ---------- UI state (非保存) ---------- */
  var catIdx = 0;
  var selRow = null; // index within current category rows

  /* ---------- helpers ---------- */
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function rowSummary(cat, row){
    var parts = [];
    for (var i=0;i<cat.cols.length;i++){ parts.push(cat.cols[i] + " " + row[i]); }
    return parts.join(" / ");
  }

  /* ---------- rendering ---------- */
  var segEl = document.getElementById("seg");
  var tblEl = document.getElementById("tbl");
  var selEl = document.getElementById("selinfo");
  var saveBtn = document.getElementById("saveBtn");
  var mineEl = document.getElementById("mine");

  function renderSeg(){
    segEl.innerHTML = CATS.map(function(c,i){
      return '<button class="' + (i===catIdx?"on":"") + '" data-act="cat" data-i="' + i + '">' + esc(c.name) + '</button>';
    }).join("");
  }

  function renderTable(){
    var cat = CATS[catIdx];
    var head = '<thead><tr>' + cat.cols.map(function(c){ return '<th>' + esc(c) + '</th>'; }).join("") + '</tr></thead>';
    var body = '<tbody>' + cat.rows.map(function(row,i){
      var cls = (i===selRow) ? ' class="sel"' : '';
      return '<tr' + cls + ' data-act="pick" data-i="' + i + '">' +
        row.map(function(v){ return '<td>' + esc(v) + '</td>'; }).join("") + '</tr>';
    }).join("") + '</tbody>';
    tblEl.innerHTML = head + body;
  }

  function renderSelInfo(){
    var cat = CATS[catIdx];
    if (selRow == null){
      selEl.innerHTML = '表の行をタップして選択';
      saveBtn.disabled = true;
    } else {
      selEl.innerHTML = '選択中: <b>' + esc(cat.name) + '</b> ' + esc(rowSummary(cat, cat.rows[selRow]));
      saveBtn.disabled = false;
    }
  }

  function renderMine(){
    if (db.mine.length === 0){
      mineEl.innerHTML =
        '<div class="empty-state">' +
          '<div class="em">📐</div>' +
          '<h2>マイサイズを登録しよう</h2>' +
          '<p>上の表から自分のサイズの行をタップし、「このサイズを保存」でラベル（私・母など）を付けて保存できます。</p>' +
        '</div>';
      return;
    }
    var html = "";
    for (var i=0;i<db.mine.length;i++){
      var m = db.mine[i];
      var cat = catByKey(m.category);
      if (!cat || !cat.rows[m.rowIndex]) continue;
      var row = cat.rows[m.rowIndex];
      html +=
        '<div class="mine-item">' +
          '<span class="mine-lb">' + esc(m.label || "マイサイズ") + '</span>' +
          '<div class="mine-main">' +
            '<div class="mine-cat">' + esc(cat.name) + '</div>' +
            '<div class="mine-vals">' + esc(rowSummary(cat, row)) + '</div>' +
          '</div>' +
          '<button class="del-btn" data-act="del-mine" data-i="' + i + '" aria-label="削除">🗑️</button>' +
        '</div>';
    }
    mineEl.innerHTML = html;
  }

  function render(){
    renderSeg();
    renderTable();
    renderSelInfo();
    renderMine();
  }

  /* ---------- modal plumbing ---------- */
  var overlay = document.getElementById("overlay");
  var sheet = document.getElementById("sheet");
  function openSheet(html){ sheet.innerHTML = '<div class="grip"></div>' + html; overlay.classList.add("on"); }
  function closeSheet(){ overlay.classList.remove("on"); }
  overlay.addEventListener("click", function(e){ if (e.target === overlay) closeSheet(); });

  function saveSheet(){
    var cat = CATS[catIdx];
    var row = cat.rows[selRow];
    openSheet(
      '<h3>このサイズを保存</h3>' +
      '<div class="save-preview">' +
        '<div class="sp-cat">' + esc(cat.name) + '</div>' +
        '<div class="sp-vals">' + esc(rowSummary(cat, row)) + '</div>' +
      '</div>' +
      '<div class="field"><label>ラベル（任意）</label>' +
        '<input type="text" id="lb" maxlength="12" placeholder="例：私 / 母"></div>' +
      '<div class="chips" id="lbchips">' +
        LABELS.map(function(l){ return '<button class="chip" data-lb="' + esc(l) + '">' + esc(l) + '</button>'; }).join("") +
      '</div>' +
      '<div class="row">' +
        '<button class="btn ghost" data-act="close">キャンセル</button>' +
        '<button class="btn primary" data-act="save-confirm">保存</button>' +
      '</div>'
    );
    var inp = document.getElementById("lb");
    document.getElementById("lbchips").addEventListener("click", function(ev){
      var b = ev.target.closest("[data-lb]"); if (!b) return;
      inp.value = b.getAttribute("data-lb");
      inp.focus();
    });
  }

  function settingsSheet(){
    openSheet(
      '<h3>設定</h3>' +
      '<button class="list-item" data-act="export"><span class="ic">⬇️</span>データを書き出す (JSON)</button>' +
      '<button class="list-item danger" data-act="wipe"><span class="ic">🗑️</span>マイサイズをすべて削除</button>' +
      '<div class="about" style="margin-top:16px">' +
        '<p><b>サイズ換算メモ</b> ／ 登録済みマイサイズ ' + db.mine.length + ' 件</p>' +
        '<p>換算表は一般的な目安です。マイサイズはこの端末内にのみ保存され、外部へ送信されません。' +
        '<a href="../../privacy-size-convert.html">プライバシーポリシー</a></p>' +
        '<p style="opacity:.7">ver 1.0.0</p>' +
      '</div>'
    );
  }

  /* ---------- actions ---------- */
  document.body.addEventListener("click", function(ev){
    var el = ev.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");

    switch(act){
      case "cat": {
        catIdx = +el.getAttribute("data-i");
        selRow = null;
        render();
        break;
      }
      case "pick": {
        var i = +el.getAttribute("data-i");
        selRow = (selRow === i) ? null : i;
        renderTable();
        renderSelInfo();
        break;
      }
      case "settings": settingsSheet(); break;
      case "save-open": {
        if (selRow == null) break;
        saveSheet();
        break;
      }
      case "close": closeSheet(); break;
      case "save-confirm": {
        var lb = (document.getElementById("lb").value || "").trim();
        db.mine.push({ category: CATS[catIdx].key, rowIndex: selRow, label: lb || "マイサイズ", savedAt: todayStr() });
        save(); closeSheet(); renderMine();
        break;
      }
      case "del-mine": {
        var idx = +el.getAttribute("data-i");
        var m = db.mine[idx];
        var nm = m ? (m.label || "マイサイズ") : "";
        if (confirm("「" + nm + "」を削除しますか？")){
          db.mine.splice(idx, 1);
          save(); renderMine();
        }
        break;
      }
      case "export": {
        var blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = "size-backup-" + todayStr() + ".json";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
        break;
      }
      case "wipe": {
        if (confirm("登録したマイサイズをすべて削除します。元に戻せません。よろしいですか？")){
          db = { version: 1, mine: [] }; save(); closeSheet(); renderMine();
        }
        break;
      }
    }
  });

  /* ---------- boot ---------- */
  render();

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }

  window.__size = { rowSummary: rowSummary, catByKey: catByKey };
})();
</script>
</body>
</html>
