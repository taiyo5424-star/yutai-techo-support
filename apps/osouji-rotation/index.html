<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#38a3d1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="場所ごとに掃除の頻度を決めて、今日やる場所を自動でお知らせ。">
<title>お掃除ローテ｜今日やる場所がわかる</title>
<style>
  :root{
    --accent:#38a3d1; --accent-d:#2b83ab; --accent-soft:#e9f5fb;
    --bg:#f4f8fb; --card:#ffffff; --text:#233038; --sub:#7c8a93;
    --line:#e2ecf1; --ok:#3fa66a; --warn:#e0952b; --danger:#d9534f;
    --radius:16px; --shadow:0 2px 12px rgba(40,70,90,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f161b; --card:#182229; --text:#e7f0f5; --sub:#93a1aa;
      --line:#26333c; --accent-soft:#182e3a; --shadow:0 2px 12px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;
    padding-bottom:env(safe-area-inset-bottom);-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--accent),var(--accent-d));
    color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));
    display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  header .ico{font-size:24px;line-height:1}
  header h1{font-size:18px;margin:0;font-weight:700;flex:1}
  header button.gear{background:rgba(255,255,255,.2);border:0;color:#fff;font-size:18px;
    width:36px;height:36px;border-radius:50%;cursor:pointer}
  main{max-width:640px;margin:0 auto;padding:16px 16px 28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  h2{font-size:15px;margin:0 0 12px;color:var(--sub);font-weight:700;letter-spacing:.02em}
  .btn{appearance:none;border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:transform .05s,filter .15s;width:100%}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{filter:brightness(1.05)}
  .btn-ghost{background:var(--accent-soft);color:var(--accent-d)}
  .btn-sm{width:auto;padding:8px 14px;font-size:14px;border-radius:10px}
  label{font-size:13px;color:var(--sub);font-weight:600;display:block;margin:2px 0 5px}
  input,select,textarea{font-family:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);color:var(--text);width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
  .row{display:flex;gap:8px;align-items:center}
  .field{margin-bottom:12px}
  ul.list{list-style:none;margin:0;padding:0}
  ul.list li{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
  ul.list li:last-child{border-bottom:0}
  ul.list li .name{flex:1;word-break:break-word}
  ul.list li .tag{font-size:12px;color:var(--sub);background:var(--bg);padding:2px 8px;border-radius:20px}
  .del{background:none;border:0;color:var(--danger);font-size:18px;cursor:pointer;padding:4px 8px}
  .empty{text-align:center;color:var(--sub);padding:20px 8px;font-size:14px}
  .ad-slot{margin:16px auto;max-width:640px;min-height:56px;border:1px dashed var(--line);border-radius:12px;
    display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px;background:var(--card)}
  footer{max-width:640px;margin:0 auto;padding:18px 16px 34px;color:var(--sub);font-size:12px;text-align:center}
  footer a{color:var(--sub)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal.open{display:flex}
  .sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
  .sheet h3{margin:0 0 12px;font-size:17px}
  .sheet .btn{margin-top:8px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#233038;color:#fff;
    padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---- app specific ---- */
  .todo{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .todo h2{color:var(--accent-d)}
  .todo .cnt{background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;margin-left:6px}
  ul.todolist{list-style:none;margin:0;padding:0}
  ul.todolist li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(0,0,0,.06)}
  ul.todolist li:last-child{border-bottom:0}
  ul.todolist .info{flex:1;min-width:0}
  ul.todolist .info .p{font-weight:700;word-break:break-word}
  ul.todolist .info .s{font-size:12px;color:var(--danger);font-weight:700}
  ul.todolist .info .s.due{color:var(--accent-d)}
  .done-btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:14px;
    font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
  .done-btn:active{transform:scale(.97)}
  ul.list li.over{background:rgba(217,83,79,.07);border-radius:10px;margin:0 -6px;padding:11px 6px}
  ul.list li .meta{font-size:12px;color:var(--sub);font-weight:600}
  .status{font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
  .status.ok{color:var(--ok);background:rgba(63,166,106,.12)}
  .status.soon{color:var(--warn);background:rgba(224,149,43,.14)}
  .status.over{color:var(--danger);background:rgba(217,83,79,.13)}
  .li-actions{display:flex;gap:6px;align-items:center}
  .allclear{text-align:center;color:var(--ok);font-weight:700;padding:6px 4px}
</style>
</head>
<body>
<header>
  <span class="ico">✨</span>
  <h1>お掃除ローテ</h1>
  <button class="gear" id="gear" aria-label="設定">⚙️</button>
</header>

<main>
  <div class="todo">
    <h2>今日やる場所<span class="cnt" id="todoCnt">0</span></h2>
    <ul class="todolist" id="todo"></ul>
    <p class="empty" id="todoEmpty" style="padding:10px">今日やるべき場所はありません。おつかれさまです ✨</p>
  </div>

  <div class="ad-slot"><!-- AdMob等の広告をここに表示 -->広告スペース</div>

  <div class="card">
    <h2>掃除する場所を追加</h2>
    <form id="addForm" autocomplete="off">
      <div class="field">
        <label for="place">場所・内容</label>
        <input id="place" placeholder="例：お風呂 / トイレ / 玄関のたたき" maxlength="24" required>
      </div>
      <div class="field">
        <label for="freq">掃除の頻度</label>
        <select id="freq">
          <option value="1">毎日</option>
          <option value="3">3日ごと</option>
          <option value="7" selected>毎週</option>
          <option value="14">2週ごと</option>
          <option value="month">毎月</option>
        </select>
      </div>
      <button class="btn btn-primary" type="submit">追加する</button>
    </form>
  </div>

  <div class="card">
    <h2>すべての場所（<span id="count">0</span>件）</h2>
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty">まだ場所が登録されていません。お風呂・トイレ・玄関など、掃除する場所を追加しましょう。追加した場所はすぐ「今日やる場所」に表示されます。</p>
  </div>
</main>

<footer>
  <p>データはこの端末内にのみ保存されます。外部送信はありません。</p>
  <p><a href="../../privacy-osouji-rotation.html">プライバシーポリシー</a>　|　<a href="../index.html">アプリ一覧</a></p>
  <p>© お掃除ローテ</p>
</footer>

<div class="modal" id="modal">
  <div class="sheet">
    <h3>設定</h3>
    <button class="btn btn-ghost" id="export">データを書き出す（バックアップ）</button>
    <button class="btn btn-ghost" id="closeModal">閉じる</button>
    <button class="btn" id="clear" style="background:var(--danger);color:#fff">すべてのデータを削除</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var KEY="osouji-rotation";
  // ---- storage helper (shared pattern across all apps) ----
  var store={
    get:function(k,d){ try{var v=localStorage.getItem(KEY+":"+k);return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set:function(k,v){ try{localStorage.setItem(KEY+":"+k,JSON.stringify(v));}catch(e){} },
    del:function(){ try{Object.keys(localStorage).forEach(function(x){if(x.indexOf(KEY+":")===0)localStorage.removeItem(x);});}catch(e){} }
  };
  function $(s){return document.querySelector(s);}
  function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show");},1800);}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  var FREQ_LABEL={"1":"毎日","3":"3日ごと","7":"毎週","14":"2週ごと","month":"毎月"};

  var tasks=store.get("tasks",[]);  // {id,place,freq:'1'|'3'|'7'|'14'|'month',last:null|"YYYY-MM-DD"}

  function save(){ store.set("tasks",tasks); }

  // date helpers
  function startOfDay(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
  function todayKey(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
  function parseKey(k){ var p=String(k).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
  function nextDue(t){
    if(!t.last) return startOfDay(new Date()); // 未実施 -> due today
    var d=startOfDay(parseKey(t.last));
    if(t.freq==="month"){ d.setMonth(d.getMonth()+1); }
    else { d.setDate(d.getDate()+parseInt(t.freq,10)); }
    return d;
  }
  function daysLeft(t){ // >0 upcoming, 0 due today, <0 overdue
    return Math.round((nextDue(t)-startOfDay(new Date()))/86400000);
  }
  function lastLabel(t){
    if(!t.last) return "未実施";
    var d=parseKey(t.last);
    return "前回 "+(d.getMonth()+1)+"/"+d.getDate();
  }

  function statusInfo(t){
    var n=daysLeft(t);
    if(n>0) return {cls: n<=1?"soon":"ok", txt:"あと"+n+"日"};
    if(n===0) return {cls:"over", txt:"今日（要掃除）"};
    return {cls:"over", txt:(-n)+"日経過（要掃除）"};
  }

  function renderTodo(){
    var due=tasks.filter(function(t){return daysLeft(t)<=0;})
      .sort(function(a,b){return daysLeft(a)-daysLeft(b);});
    $("#todoCnt").textContent=due.length;
    var empty=$("#todoEmpty"), ul=$("#todo");
    empty.style.display=due.length?"none":"block";
    ul.innerHTML=due.map(function(t){
      var n=daysLeft(t);
      var s = n===0 ? '<span class="s due">今日が予定日です</span>'
                    : '<span class="s">'+(-n)+'日経過しています</span>';
      return '<li data-id="'+esc(String(t.id))+'">'+
        '<div class="info"><div class="p">'+esc(t.place)+'</div>'+s+
        '　<span class="tag">'+esc(FREQ_LABEL[t.freq])+'</span></div>'+
        '<button class="done-btn" data-done="'+esc(String(t.id))+'">やった！</button></li>';
    }).join("");
  }

  function renderList(){
    var list=$("#list"), empty=$("#empty");
    $("#count").textContent=tasks.length;
    empty.style.display=tasks.length?"none":"block";
    var sorted=tasks.slice().sort(function(a,b){return daysLeft(a)-daysLeft(b);});
    list.innerHTML=sorted.map(function(t){
      var st=statusInfo(t), over=daysLeft(t)<=0;
      return '<li class="'+(over?"over":"")+'" data-id="'+esc(String(t.id))+'">'+
        '<span class="name"><span class="p" style="font-weight:600">'+esc(t.place)+'</span><br>'+
        '<span class="meta">'+esc(FREQ_LABEL[t.freq])+'・'+esc(lastLabel(t))+'</span></span>'+
        '<div class="li-actions">'+
          '<span class="status '+st.cls+'">'+esc(st.txt)+'</span>'+
          '<button class="done-btn" data-done="'+esc(String(t.id))+'">やった！</button>'+
          '<button class="del" aria-label="削除">🗑</button>'+
        '</div></li>';
    }).join("");
  }

  function render(){ renderTodo(); renderList(); }

  function markDone(id){
    tasks.forEach(function(t){ if(String(t.id)===String(id)) t.last=todayKey(); });
    save(); render(); toast("おつかれさま！記録しました ✨");
  }

  // add
  $("#addForm").addEventListener("submit",function(e){
    e.preventDefault();
    var p=$("#place").value.trim(); if(!p){ toast("場所を入力してください"); return; }
    tasks.push({id:Date.now()+"-"+Math.floor(performance.now()),place:p,freq:$("#freq").value,last:null});
    save(); $("#place").value=""; render(); toast("追加しました");
  });

  // done / delete (event delegation on both lists)
  document.addEventListener("click",function(e){
    var db=e.target.closest(".done-btn");
    if(db){ markDone(db.getAttribute("data-done")); return; }
    if(e.target.classList.contains("del")){
      var id=e.target.closest("li").getAttribute("data-id");
      if(confirm("この場所を削除しますか？")){
        tasks=tasks.filter(function(t){return String(t.id)!==String(id);});
        save(); render(); toast("削除しました");
      }
    }
  });

  // settings modal
  $("#gear").addEventListener("click",function(){$("#modal").classList.add("open");});
  $("#closeModal").addEventListener("click",function(){$("#modal").classList.remove("open");});
  $("#modal").addEventListener("click",function(e){if(e.target===this)this.classList.remove("open");});
  $("#export").addEventListener("click",function(){
    var data=JSON.stringify({tasks:tasks},null,2);
    try{
      var b=new Blob([data],{type:"application/json"});
      var a=document.createElement("a");a.href=URL.createObjectURL(b);
      a.download="osouji-rotation-backup.json";a.click();
    }catch(e){ prompt("以下をコピーして保存してください",data); }
  });
  $("#clear").addEventListener("click",function(){
    if(confirm("登録した場所と実施記録をすべて削除します。よろしいですか？")){
      store.del(); tasks=[]; render(); $("#modal").classList.remove("open");
      toast("削除しました");
    }
  });

  render();
})();
</script>
</body>
</html>
