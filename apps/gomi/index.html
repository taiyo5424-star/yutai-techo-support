<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゴミの日メモ</title>
<meta name="description" content="曜日ごとのゴミ収集を登録して、今日・明日の出す日をひと目で確認。会員登録不要・完全ローカル保存。">
<meta name="theme-color" content="#f43f5e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ゴミの日">
<style>
  :root{
    --accent:#f43f5e; --accent2:#e11d48;
    --bg:#f4f6f8; --surface:#ffffff; --surface2:#f8fafc;
    --text:#0f172a; --muted:#64748b; --line:#e6e9ee; --empty:#eceff3;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
    --danger:#ef4444;
    --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1220; --surface:#131c2b; --surface2:#0f1826;
      --text:#e7ecf3; --muted:#94a3b8; --line:#25324a; --empty:#1b2536;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;color:inherit;cursor:pointer}
  .app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px calc(28px + var(--safe-b))}
  /* header */
  header{
    position:sticky;top:0;z-index:20;background:var(--bg);
    padding:calc(12px + var(--safe-t)) 0 10px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .logo{width:34px;height:34px;border-radius:9px;flex:0 0 auto;box-shadow:0 2px 6px rgba(225,29,72,.35)}
  .brand h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.01em;white-space:nowrap}
  .icon-btn{
    width:40px;height:40px;border:none;border-radius:12px;background:var(--surface);
    box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px;flex:0 0 auto
  }
  .icon-btn:active{transform:scale(.94)}
  /* today summary */
  .summary{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;border-radius:18px;padding:16px 18px;margin:4px 0 12px;
    box-shadow:0 8px 22px rgba(225,29,72,.28);position:relative;overflow:hidden
  }
  .summary .date{font-size:12.5px;opacity:.92;font-weight:600}
  .summary .big{font-size:20px;font-weight:800;margin-top:2px}
  .summary .sub{font-size:14px;opacity:.95;margin-top:8px;font-weight:600}
  .summary .today-chips{margin-top:11px;display:flex;flex-wrap:wrap;gap:8px}
  .summary .gchip{background:#fff;color:#0f172a}
  /* colored type chip */
  .gchip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;font-size:13.5px;font-weight:700;line-height:1;white-space:nowrap}
  .gchip i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:0 0 auto}
  /* tomorrow card */
  .tm-card{
    background:var(--surface);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--shadow);padding:14px 16px;margin-bottom:4px
  }
  .tm-head{display:flex;align-items:baseline;gap:9px;margin-bottom:11px}
  .tm-head .lb{font-size:14px;font-weight:800}
  .tm-head .dt{font-size:12.5px;color:var(--muted);font-weight:600}
  .chips-row{display:flex;flex-wrap:wrap;gap:8px}
  .tm-none{color:var(--muted);font-size:13.5px;font-weight:600}
  .hint{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:11px;padding:9px 12px}
  /* section head */
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
  .sec-head h2{font-size:15px;font-weight:800;margin:0}
  .edit-btn{
    border:1px solid var(--line);background:var(--surface);border-radius:99px;
    padding:8px 16px;font-size:13.5px;font-weight:800;box-shadow:var(--shadow);color:var(--accent2)
  }
  .edit-btn:active{transform:scale(.96)}
  /* weekboard */
  .weekboard{background:var(--surface);border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
  .wk-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);min-height:56px}
  .wk-row:last-child{border-bottom:none}
  .wk-row.today{background:linear-gradient(135deg,rgba(244,63,94,.10),rgba(225,29,72,.06))}
  .wk-day{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--empty);color:var(--muted);flex:0 0 auto}
  .wk-row.sun .wk-day{color:#e11d48}
  .wk-row.sat .wk-day{color:#2563eb}
  .wk-row.today .wk-day{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .wk-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
  .wk-none{color:var(--muted);font-size:13px}
  .todaytag{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--accent2);background:rgba(244,63,94,.12);padding:3px 8px;border-radius:99px;flex:0 0 auto}
  /* empty state */
  .empty-state{text-align:center;padding:30px 10px 8px;color:var(--muted)}
  .empty-state .em{font-size:44px}
  .empty-state h2{color:var(--text);font-size:17px;margin:10px 0 4px}
  .empty-state p{font-size:13.5px;margin:0 auto;max-width:290px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
  .chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:11px 16px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow)}
  .chip.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
  .chip:active{transform:scale(.96)}
  .preset-note{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.7}
  /* overlay + sheet */
  .overlay{
    position:fixed;inset:0;z-index:50;background:rgba(9,14,24,.5);
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .2s ease;backdrop-filter:blur(2px)
  }
  .overlay.on{opacity:1;pointer-events:auto}
  .sheet{
    width:100%;max-width:520px;background:var(--surface);
    border-radius:22px 22px 0 0;padding:8px 18px calc(20px + var(--safe-b));
    box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(20px);transition:transform .22s ease;
    max-height:92vh;overflow:auto
  }
  .overlay.on .sheet{transform:translateY(0)}
  .grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 12px}
  .sheet h3{margin:2px 0 14px;font-size:18px;font-weight:800}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px}
  .field input[type=text]{
    width:100%;border:1.5px solid var(--line);background:var(--surface2);color:var(--text);
    border-radius:12px;padding:12px 14px;font-size:16px;outline:none
  }
  .field input[type=text]:focus{border-color:var(--accent)}
  .pick{display:flex;flex-wrap:wrap;gap:10px}
  .pick .col{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
  .pick .col.sel{border-color:var(--text)}
  .wdays{display:flex;gap:6px}
  .wd-btn{flex:1;height:46px;border:1.5px solid var(--line);background:var(--surface2);border-radius:11px;font-size:14px;font-weight:800;color:var(--muted)}
  .wd-btn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
  .wd-btn:active{transform:scale(.95)}
  .row{display:flex;gap:10px;margin-top:6px}
  .btn{flex:1;border:none;border-radius:13px;padding:14px;font-size:15.5px;font-weight:800}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 20px rgba(225,29,72,.35)}
  .btn.ghost{background:var(--empty);color:var(--text)}
  .btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
  .btn:active{transform:scale(.97)}
  .sheet .list-item{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;background:transparent;
    padding:14px 4px;font-size:15px;font-weight:600;border-bottom:1px solid var(--line);color:inherit
  }
  .sheet .list-item:last-child{border-bottom:none}
  .sheet .list-item .ic{font-size:19px;width:24px;text-align:center;flex:0 0 auto}
  .sheet .list-item .dot{width:16px;height:16px;border-radius:50%;flex:0 0 auto}
  .sheet .list-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheet .list-item .sub{font-size:12px;color:var(--muted);font-weight:600;flex:0 0 auto}
  .sheet .list-item.add{color:var(--accent2);font-weight:800}
  .sheet .list-item.danger{color:var(--danger)}
  .about{font-size:12.5px;color:var(--muted);line-height:1.7}
  .about a{color:var(--accent);font-weight:700;text-decoration:none}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <img class="logo" src="icon-192.png" alt="" width="34" height="34">
      <h1>ゴミの日メモ</h1>
    </div>
    <button class="icon-btn" data-act="settings" aria-label="設定">⚙️</button>
  </header>
  <div id="summary"></div>
  <main id="main" aria-live="polite"></main>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
  "use strict";
  var KEY = "gomi.v1";
  var WD = ["日","月","火","水","木","金","土"];
  var COLORS = ["#ef4444","#f97316","#f59e0b","#10b981","#14b8a6","#3b82f6","#8b5cf6","#64748b"];
  var PRESETS = [
    {name:"燃えるゴミ", color:"#ef4444", days:[1,4]},
    {name:"プラ", color:"#3b82f6", days:[2]},
    {name:"びん・かん", color:"#10b981", days:[3]},
    {name:"古紙", color:"#f59e0b", days:[5]}
  ];

  /* ---------- date helpers ---------- */
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function parse(s){ var a = s.split("-"); return new Date(+a[0], +a[1]-1, +a[2]); }
  function addDays(s, delta){
    var d = parse(s); d.setDate(d.getDate() + delta);
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function dateLabel(s){
    var d = parse(s);
    return (d.getMonth()+1) + "月" + d.getDate() + "日(" + WD[d.getDay()] + ")";
  }

  /* ---------- storage ---------- */
  var db = load();
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if (raw){ var o = JSON.parse(raw); if (o && o.types) return o; }
    }catch(e){}
    return { version: 1, types: [] };
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
  function uid(){ return "t" + Date.now().toString(36) + Math.floor(Math.random()*1e5).toString(36); }
  function getType(id){ for (var i=0;i<db.types.length;i++){ if (db.types[i].id===id) return db.types[i]; } return null; }

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

  /* types collecting on a given weekday (0=日) */
  function forDow(dow){
    return db.types.filter(function(t){ return t.days && t.days.indexOf(dow) >= 0; });
  }
  function chip(t){
    return '<span class="gchip" style="--c:' + t.color + ';background:' + t.color + '22"><i></i>' + esc(t.name) + '</span>';
  }
  function daysLabel(days){
    if (!days || !days.length) return "設定なし";
    return days.slice().sort(function(a,b){ return a-b; }).map(function(d){ return WD[d]; }).join("・");
  }

  /* ---------- rendering ---------- */
  var sumEl = document.getElementById("summary");
  var mainEl = document.getElementById("main");

  function render(){
    if (db.types.length === 0){
      sumEl.innerHTML = "";
      mainEl.innerHTML =
        '<div class="empty-state">' +
          '<div class="em">🗑️</div>' +
          '<h2>ゴミ収集を登録しよう</h2>' +
          '<p>曜日ごとの収集を登録すると、今日と明日の「出す日」がひと目でわかります。</p>' +
          '<div class="chips">' +
            '<button class="chip primary" data-act="presets">🗓 よくある設定で作成</button>' +
            '<button class="chip" data-act="add-type">＋ 自分で追加</button>' +
          '</div>' +
          '<div class="preset-note">よくある設定：燃えるゴミ=月・木 / プラ=火 / びん・かん=水 / 古紙=金</div>' +
        '</div>';
      return;
    }

    var t = todayStr();
    var todayDow = parse(t).getDay();
    var tmrStr = addDays(t, 1);
    var tmrDow = parse(tmrStr).getDay();

    /* today gradient card */
    var todayTypes = forDow(todayDow);
    var todayBody = todayTypes.length
      ? '<div class="today-chips">' + todayTypes.map(chip).join("") + '</div>'
      : '<div class="sub">今日はありません 🙆</div>';
    sumEl.innerHTML =
      '<div class="summary">' +
        '<div class="date">' + dateLabel(t) + '</div>' +
        '<div class="big">今日の収集</div>' +
        todayBody +
      '</div>';

    /* tomorrow card + hint */
    var tmrTypes = forDow(tmrDow);
    var tmrBody = tmrTypes.length
      ? '<div class="chips-row">' + tmrTypes.map(chip).join("") + '</div>'
      : '<div class="tm-none">明日はありません</div>';
    var html =
      '<div class="tm-card">' +
        '<div class="tm-head"><span class="lb">明日</span><span class="dt">' + dateLabel(tmrStr) + '</span></div>' +
        tmrBody +
        '<div class="hint">🌙 <span>夜のうちに準備を</span></div>' +
      '</div>';

    /* week board */
    html +=
      '<div class="sec-head"><h2>今週の予定</h2>' +
        '<button class="edit-btn" data-act="manage">編集</button></div>' +
      '<div class="weekboard">';
    for (var w = 0; w < 7; w++){
      var wtypes = forDow(w);
      var rowCls = "wk-row" + (w === todayDow ? " today" : "") + (w === 0 ? " sun" : "") + (w === 6 ? " sat" : "");
      html +=
        '<div class="' + rowCls + '">' +
          '<span class="wk-day">' + WD[w] + '</span>' +
          '<div class="wk-chips">' +
            (wtypes.length ? wtypes.map(chip).join("") : '<span class="wk-none">—</span>') +
          '</div>' +
          (w === todayDow ? '<span class="todaytag">今日</span>' : '') +
        '</div>';
    }
    html += '</div>';

    mainEl.innerHTML = html;
  }

  /* ---------- modal plumbing ---------- */
  var overlay = document.getElementById("overlay");
  var sheet = document.getElementById("sheet");
  function openSheet(html){ sheet.innerHTML = '<div class="grip"></div>' + html; overlay.classList.add("on"); }
  function closeSheet(){ overlay.classList.remove("on"); }
  overlay.addEventListener("click", function(e){ if (e.target === overlay) closeSheet(); });

  /* ---------- management sheet ---------- */
  function manageSheet(){
    var items = "";
    if (db.types.length === 0){
      items = '<p class="tm-none" style="padding:8px 4px">まだ種別がありません。</p>';
    } else {
      items = db.types.map(function(t){
        return '<button class="list-item" data-act="edit-type" data-id="' + t.id + '">' +
                 '<span class="dot" style="background:' + t.color + '"></span>' +
                 '<span class="nm">' + esc(t.name) + '</span>' +
                 '<span class="sub">' + daysLabel(t.days) + '</span>' +
               '</button>';
      }).join("");
    }
    openSheet(
      '<h3>種別の管理</h3>' +
      items +
      '<button class="list-item add" data-act="add-type"><span class="ic">＋</span>種別を追加</button>'
    );
  }

  /* temp form state */
  var form = { color: COLORS[0], days: [] };

  function typeForm(title, t){
    form.color = t ? t.color : COLORS[0];
    form.days = t ? t.days.slice() : [];
    var name = t ? t.name : "";
    openSheet(
      '<h3>' + title + '</h3>' +
      '<div class="field"><label>種別の名前</label>' +
        '<input type="text" id="f-name" maxlength="20" placeholder="例：燃えるゴミ" value="' + esc(name) + '"></div>' +
      '<div class="field"><label>カラー</label><div class="pick" id="f-color">' +
        COLORS.map(function(c){ return '<button class="col' + (c===form.color?" sel":"") + '" style="background:' + c + '" data-color="' + c + '" aria-label="カラー"></button>'; }).join("") +
      '</div></div>' +
      '<div class="field"><label>収集する曜日（複数選べます）</label><div class="wdays" id="f-days">' +
        WD.map(function(w,i){ return '<button class="wd-btn' + (form.days.indexOf(i)>=0?" on":"") + '" data-d="' + i + '">' + w + '</button>'; }).join("") +
      '</div></div>' +
      '<div class="row">' +
        '<button class="btn ghost" data-act="close">キャンセル</button>' +
        '<button class="btn primary" data-act="' + (t ? "save-edit" : "save-add") + '" data-id="' + (t ? t.id : "") + '">保存</button>' +
      '</div>' +
      (t ? '<div class="row"><button class="btn danger" data-act="delete-type" data-id="' + t.id + '">この種別を削除</button></div>' : "")
    );
    document.getElementById("f-color").addEventListener("click", function(ev){
      var b = ev.target.closest("[data-color]"); if (!b) return;
      form.color = b.getAttribute("data-color");
      this.querySelectorAll(".col").forEach(function(o){ o.classList.toggle("sel", o===b); });
    });
    document.getElementById("f-days").addEventListener("click", function(ev){
      var b = ev.target.closest("[data-d]"); if (!b) return;
      var d = +b.getAttribute("data-d");
      var idx = form.days.indexOf(d);
      if (idx >= 0) form.days.splice(idx, 1); else form.days.push(d);
      b.classList.toggle("on", form.days.indexOf(d) >= 0);
    });
    setTimeout(function(){ if (!t){ var ne = document.getElementById("f-name"); if (ne) ne.focus(); } }, 60);
  }

  function settingsSheet(){
    openSheet(
      '<h3>設定</h3>' +
      '<button class="list-item" data-act="export"><span class="ic">⬇️</span>データを書き出す (JSON)</button>' +
      '<button class="list-item danger" data-act="wipe"><span class="ic">🗑️</span>すべてのデータを削除</button>' +
      '<div class="about" style="margin-top:16px">' +
        '<p><b>ゴミの日メモ</b> ' + db.types.length + ' 種別を登録中</p>' +
        '<p>データはこの端末内にのみ保存され、外部へ送信されません。' +
        '<a href="../../privacy-gomi-memo.html">プライバシーポリシー</a></p>' +
        '<p style="opacity:.7">ver 1.0.0</p>' +
      '</div>'
    );
  }

  /* ---------- actions ---------- */
  document.body.addEventListener("click", function(ev){
    var el = ev.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");
    var id = el.getAttribute("data-id");
    var t = id ? getType(id) : null;

    switch(act){
      case "settings": settingsSheet(); break;
      case "manage": manageSheet(); break;
      case "add-type": typeForm("種別を追加"); break;
      case "edit-type": typeForm("種別を編集", t); break;
      case "close": closeSheet(); break;
      case "presets": {
        PRESETS.forEach(function(p){
          db.types.push({ id: uid(), name: p.name, color: p.color, days: p.days.slice() });
        });
        save(); render();
        break;
      }
      case "save-add": {
        var nm = (document.getElementById("f-name").value || "").trim();
        if (!nm) nm = "ゴミ";
        db.types.push({ id: uid(), name: nm, color: form.color, days: form.days.slice().sort(function(a,b){ return a-b; }) });
        save(); manageSheet(); render();
        break;
      }
      case "save-edit": {
        var nm2 = (document.getElementById("f-name").value || "").trim();
        if (t){
          t.name = nm2 || t.name;
          t.color = form.color;
          t.days = form.days.slice().sort(function(a,b){ return a-b; });
          save();
        }
        manageSheet(); render();
        break;
      }
      case "delete-type": {
        if (confirm("「" + (t ? t.name : "") + "」を削除します。よろしいですか？")){
          db.types = db.types.filter(function(x){ return x.id !== id; });
          save(); manageSheet(); render();
        }
        break;
      }
      case "export": {
        var blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = "gomi-backup-" + todayStr() + ".json";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
        break;
      }
      case "wipe": {
        if (confirm("すべての種別を削除します。元に戻せません。よろしいですか？")){
          db = { version: 1, types: [] }; save(); closeSheet(); render();
        }
        break;
      }
    }
  });

  /* ---------- boot ---------- */
  render();

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
