<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5566c9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="洗剤やトイレットペーパーなど日用品の残量を管理。少なくなったら買い足しリストに。">
<title>日用品ストック｜残量管理と買い足しリスト</title>
<style>
  :root{
    --accent:#5566c9; --accent-d:#4451a8; --accent-soft:#eef0fb;
    --bg:#faf7f5; --card:#ffffff; --text:#2b2622; --sub:#8a827b;
    --line:#eee6e0; --ok:#3fa66a; --warn:#e0952b; --low:#e07b2b; --danger:#d9534f;
    --radius:16px; --shadow:0 2px 12px rgba(80,60,50,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#15161f; --card:#1f2029; --text:#f2ece6; --sub:#a29fac;
      --line:#2e2f3c; --accent-soft:#20233a; --shadow:0 2px 12px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;
    padding-bottom:env(safe-area-inset-bottom);-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--accent),var(--accent-d));
    color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));
    display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  header .ico{font-size:24px;line-height:1}
  header h1{font-size:18px;margin:0;font-weight:700;flex:1}
  header button.gear{background:rgba(255,255,255,.2);border:0;color:#fff;font-size:18px;
    width:36px;height:36px;border-radius:50%;cursor:pointer}
  main{max-width:640px;margin:0 auto;padding:16px 16px 28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card.restock{border-left:4px solid var(--accent)}
  h2{font-size:15px;margin:0 0 12px;color:var(--sub);font-weight:700;letter-spacing:.02em}
  .btn{appearance:none;border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:transform .05s,filter .15s;width:100%}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{filter:brightness(1.05)}
  .btn-ghost{background:var(--accent-soft);color:var(--accent-d)}
  .btn-sm{width:auto;padding:9px 14px;font-size:14px;border-radius:10px}
  input,select,textarea{font-family:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);color:var(--text);width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
  .row{display:flex;gap:8px;align-items:center}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--accent-soft);color:var(--accent-d);border:1px solid var(--line);border-radius:20px;
    padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;line-height:1}
  .chip:active{transform:scale(.96)}
  .rlist{display:flex;flex-wrap:wrap;gap:8px}
  .rpill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;
    padding:6px 12px;font-size:14px;font-weight:600;background:var(--bg)}
  .rpill .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .rpill .st{font-size:12px;color:var(--sub);font-weight:600}
  .stock{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card)}
  .stock:last-child{margin-bottom:0}
  .stock-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .stock-top .name{flex:1;font-weight:700;word-break:break-word}
  .stock-top .cur{font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;color:#fff;white-space:nowrap}
  .bar{height:9px;border-radius:6px;background:var(--line);overflow:hidden;cursor:pointer;margin-bottom:10px}
  .bar > i{display:block;height:100%;border-radius:6px;transition:width .2s}
  .levels{display:flex;gap:6px;flex-wrap:wrap}
  .lv{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:16px;
    padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;line-height:1}
  .lv.on{color:#fff;border-color:transparent}
  .del{background:none;border:0;color:var(--danger);font-size:18px;cursor:pointer;padding:4px 8px}
  .empty{text-align:center;color:var(--sub);padding:22px 8px;font-size:14px}
  .ad-slot{margin:16px auto;max-width:640px;min-height:56px;border:1px dashed var(--line);border-radius:12px;
    display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px;background:var(--card)}
  footer{max-width:640px;margin:0 auto;padding:18px 16px 34px;color:var(--sub);font-size:12px;text-align:center}
  footer a{color:var(--sub)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal.open{display:flex}
  .sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
  .sheet h3{margin:0 0 12px;font-size:17px}
  .sheet .btn{margin-top:8px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#2b2622;color:#fff;
    padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <span class="ico">🧴</span>
  <h1>日用品ストック</h1>
  <button class="gear" id="gear" aria-label="設定">⚙️</button>
</header>

<main>
  <div class="card restock">
    <h2>🛒 買い足すもの（<span id="rcount">0</span>）</h2>
    <div class="rlist" id="restock"></div>
    <p class="empty" id="rEmpty" style="padding:8px">いまのところ買い足すものはありません。</p>
  </div>

  <div class="ad-slot"><!-- AdMob等の広告をここに表示 -->広告スペース</div>

  <div class="card">
    <h2>品目を追加</h2>
    <form id="addForm" class="row" autocomplete="off">
      <input id="name" placeholder="例：食器用洗剤" maxlength="30" required>
      <button class="btn btn-primary btn-sm" type="submit">追加</button>
    </form>
    <div class="chips" id="quick" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <h2>在庫リスト（<span id="count">0</span>）</h2>
    <div id="list"></div>
    <p class="empty" id="empty">まだ品目がありません。よく使う日用品を登録して残量を管理しましょう。</p>
  </div>
</main>

<footer>
  <p>データはこの端末内にのみ保存されます。外部送信はありません。</p>
  <p><a href="../../privacy-nichiyo-stock.html">プライバシーポリシー</a>　|　<a href="../index.html">アプリ一覧</a></p>
  <p>© 日用品ストック</p>
</footer>

<div class="modal" id="modal">
  <div class="sheet">
    <h3>設定</h3>
    <button class="btn btn-ghost" id="export">データを書き出す（バックアップ）</button>
    <button class="btn btn-ghost" id="closeModal">閉じる</button>
    <button class="btn" id="clear" style="background:var(--danger);color:#fff">すべてのデータを削除</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var KEY="nichiyo-stock";
  // ---- storage helper (shared pattern across all apps) ----
  var store={
    get:function(k,d){ try{var v=localStorage.getItem(KEY+":"+k);return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set:function(k,v){ try{localStorage.setItem(KEY+":"+k,JSON.stringify(v));}catch(e){} },
    del:function(){ try{Object.keys(localStorage).forEach(function(x){if(x.indexOf(KEY+":")===0)localStorage.removeItem(x);});}catch(e){} }
  };
  function $(s){return document.querySelector(s);}
  function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show");},1800);}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  // residual-amount levels (order = fullest -> empty)
  var LEVELS=[
    {k:"full",label:"たっぷり",pct:100,color:"var(--ok)"},
    {k:"half",label:"半分",pct:55,color:"var(--warn)"},
    {k:"low",label:"残りわずか",pct:25,color:"var(--low)"},
    {k:"none",label:"なし",pct:6,color:"var(--danger)"}
  ];
  function lvl(k){ for(var i=0;i<LEVELS.length;i++){ if(LEVELS[i].k===k) return LEVELS[i]; } return LEVELS[0]; }
  function needBuy(k){ return k==="low"||k==="none"; }
  // quick-add staple daily goods
  var QUICK=["トイレットペーパー","ティッシュ","食器用洗剤","洗濯洗剤","柔軟剤","シャンプー","リンス","ボディソープ",
    "ハンドソープ","歯磨き粉","ゴミ袋","ラップ","アルミホイル","乾電池"];

  var items=store.get("items",[]); // {id,name,level}

  function save(){ store.set("items",items); }

  function render(){
    $("#count").textContent=items.length;
    $("#empty").style.display=items.length?"none":"block";

    // restock aggregation (low / none)
    var need=items.filter(function(i){return needBuy(i.level);});
    $("#rcount").textContent=need.length;
    var rEl=$("#restock"), rEmpty=$("#rEmpty");
    if(!need.length){ rEl.innerHTML=""; rEmpty.style.display="block"; }
    else{
      rEmpty.style.display="none";
      rEl.innerHTML=need.map(function(it){
        var L=lvl(it.level);
        return '<span class="rpill"><span class="dot" style="background:'+L.color+'"></span>'+
          esc(it.name)+'<span class="st">'+L.label+'</span></span>';
      }).join("");
    }

    // stock list
    var listEl=$("#list");
    listEl.innerHTML=items.map(function(it){
      var L=lvl(it.level);
      var lvHtml=LEVELS.map(function(o){
        var on=o.k===it.level;
        return '<button type="button" class="lv'+(on?' on':'')+'" data-set="'+o.k+'"'+
          (on?' style="background:'+o.color+'"':'')+'>'+o.label+'</button>';
      }).join("");
      return '<div class="stock" data-id="'+esc(it.id)+'">'+
        '<div class="stock-top"><span class="name">'+esc(it.name)+'</span>'+
        '<span class="cur" style="background:'+L.color+'">'+L.label+'</span>'+
        '<button class="del" aria-label="削除">🗑</button></div>'+
        '<div class="bar" title="タップで残量を減らす"><i style="width:'+L.pct+'%;background:'+L.color+'"></i></div>'+
        '<div class="levels">'+lvHtml+'</div></div>';
    }).join("");
  }

  function addItem(name){
    name=String(name).trim(); if(!name)return;
    items.push({id:Date.now()+"-"+Math.floor(performance.now()),name:name,level:"full"});
    save(); render();
  }
  function setLevel(id,k){
    var it=items.filter(function(i){return String(i.id)===String(id);})[0];
    if(it){ it.level=k; save(); render(); }
  }
  function cycleLevel(id){
    var it=items.filter(function(i){return String(i.id)===String(id);})[0];
    if(!it)return;
    var idx=0; for(var i=0;i<LEVELS.length;i++){ if(LEVELS[i].k===it.level){ idx=i; break; } }
    it.level=LEVELS[(idx+1)%LEVELS.length].k; save(); render();
  }

  // quick chips
  (function(){
    $("#quick").innerHTML=QUICK.map(function(n,i){
      return '<button type="button" class="chip" data-i="'+i+'">'+esc(n)+'</button>';
    }).join("");
  })();
  $("#quick").addEventListener("click",function(e){
    var b=e.target.closest(".chip"); if(!b)return;
    var n=QUICK[+b.getAttribute("data-i")];
    addItem(n); toast("「"+n+"」を追加しました");
  });

  // add form
  $("#addForm").addEventListener("submit",function(e){
    e.preventDefault();
    var n=$("#name").value.trim(); if(!n)return;
    addItem(n); $("#name").value=""; $("#name").focus(); toast("追加しました");
  });

  // list interactions
  $("#list").addEventListener("click",function(e){
    var box=e.target.closest(".stock"); if(!box)return;
    var id=box.getAttribute("data-id");
    if(e.target.classList.contains("del")){
      items=items.filter(function(i){return String(i.id)!==String(id);});
      save(); render(); return;
    }
    if(e.target.classList.contains("lv")){
      setLevel(id,e.target.getAttribute("data-set")); return;
    }
    if(e.target.closest(".bar")){
      cycleLevel(id); return;
    }
  });

  // settings modal
  $("#gear").addEventListener("click",function(){$("#modal").classList.add("open");});
  $("#closeModal").addEventListener("click",function(){$("#modal").classList.remove("open");});
  $("#modal").addEventListener("click",function(e){if(e.target===this)this.classList.remove("open");});
  $("#export").addEventListener("click",function(){
    var data=JSON.stringify({items:items},null,2);
    try{
      var b=new Blob([data],{type:"application/json"});
      var a=document.createElement("a");a.href=URL.createObjectURL(b);
      a.download="nichiyo-stock-backup.json";a.click();
    }catch(e){ prompt("以下をコピーして保存してください",data); }
  });
  $("#clear").addEventListener("click",function(){
    if(confirm("すべての日用品ストックのデータを削除します。よろしいですか？")){
      store.del(); items=[]; render(); $("#modal").classList.remove("open"); toast("削除しました");
    }
  });

  render();
})();
</script>
</body>
</html>
