<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>しまい場所メモ</title>
<meta name="description" content="大事なものをどこにしまったかメモ。名前・場所・写真で記録して、必要なときにすぐ探せる。会員登録不要・完全ローカル保存。">
<meta name="theme-color" content="#f59e0b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="しまい場所">
<style>
  :root{
    --accent:#f59e0b; --accent2:#d97706;
    --bg:#f4f6f8; --surface:#ffffff; --surface2:#f8fafc;
    --text:#0f172a; --muted:#64748b; --line:#e6e9ee; --empty:#eceff3;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
    --danger:#ef4444;
    --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1220; --surface:#131c2b; --surface2:#0f1826;
      --text:#e7ecf3; --muted:#94a3b8; --line:#25324a; --empty:#1b2536;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Yu Gothic Medium",YuGothic,"Yu Gothic",Meiryo,"Noto Sans JP",sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;color:inherit;cursor:pointer}
  .app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px calc(96px + var(--safe-b))}
  /* header */
  header{
    position:sticky;top:0;z-index:20;background:var(--bg);
    padding:calc(12px + var(--safe-t)) 0 10px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .logo{width:34px;height:34px;border-radius:9px;flex:0 0 auto;box-shadow:0 2px 6px rgba(217,119,6,.35)}
  .brand h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.01em;white-space:nowrap}
  .icon-btn{
    width:40px;height:40px;border:none;border-radius:12px;background:var(--surface);
    box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px;flex:0 0 auto
  }
  .icon-btn:active{transform:scale(.94)}
  /* search */
  .search{
    display:flex;align-items:center;gap:9px;background:var(--surface);
    border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;margin:4px 0 10px;
    box-shadow:var(--shadow)
  }
  .search:focus-within{border-color:var(--accent)}
  .search .mag{font-size:16px;color:var(--muted);flex:0 0 auto}
  .search input{border:none;background:transparent;outline:none;flex:1;min-width:0;font-size:16px;color:var(--text)}
  .search .clr{border:none;background:transparent;color:var(--muted);font-size:18px;width:26px;height:26px;border-radius:8px;display:none;place-items:center;flex:0 0 auto}
  .search .clr.on{display:grid}
  .count{font-size:12.5px;color:var(--muted);font-weight:700;margin:0 4px 10px}
  /* item row */
  .item{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow)
  }
  .item:active{transform:scale(.99)}
  .item .thumb{width:48px;height:48px;border-radius:12px;object-fit:cover;flex:0 0 auto}
  .item .ic{width:48px;height:48px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:22px;flex:0 0 auto;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .item .main{flex:1;min-width:0}
  .item .name{font-weight:800;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .place{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .place.none{opacity:.7;font-weight:500}
  .item .note{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
  .item .chev{color:var(--muted);font-size:20px;flex:0 0 auto;opacity:.7}
  /* no match */
  .nomatch{text-align:center;color:var(--muted);font-size:14px;padding:34px 10px;font-weight:600}
  /* empty state */
  .empty-state{text-align:center;padding:30px 10px 8px;color:var(--muted)}
  .empty-state .em{font-size:48px}
  .empty-state h2{color:var(--text);font-size:18px;margin:12px 0 5px}
  .empty-state p{font-size:13.5px;margin:0 auto;max-width:290px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
  .chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 15px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow)}
  .chip:active{transform:scale(.96)}
  .chip-hint{font-size:12px;color:var(--muted);margin-top:14px;opacity:.85}
  /* FAB (bottom-right) */
  .fab{
    position:fixed;right:calc(16px + var(--safe-b));bottom:calc(18px + var(--safe-b));
    z-index:30;border:none;border-radius:99px;padding:14px 20px;font-size:15px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 10px 26px rgba(217,119,6,.45);display:flex;align-items:center;gap:8px
  }
  .fab:active{transform:scale(.96)}
  .fab .plus{font-size:20px;line-height:1;margin-top:-1px}
  /* overlay + sheet */
  .overlay{
    position:fixed;inset:0;z-index:50;background:rgba(9,14,24,.5);
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .2s ease;backdrop-filter:blur(2px)
  }
  .overlay.on{opacity:1;pointer-events:auto}
  .sheet{
    width:100%;max-width:520px;background:var(--surface);
    border-radius:22px 22px 0 0;padding:8px 18px calc(20px + var(--safe-b));
    box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(20px);transition:transform .22s ease;
    max-height:92vh;overflow:auto
  }
  .overlay.on .sheet{transform:translateY(0)}
  .grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 12px}
  .sheet h3{margin:2px 0 14px;font-size:18px;font-weight:800}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:7px}
  .field .req{color:var(--accent2);margin-left:3px}
  .field input[type=text]{
    width:100%;border:1.5px solid var(--line);background:var(--surface2);color:var(--text);
    border-radius:12px;padding:12px 14px;font-size:16px;outline:none
  }
  .field input[type=text]:focus{border-color:var(--accent)}
  .field input.err{border-color:var(--danger)}
  .field textarea{
    width:100%;border:1.5px solid var(--line);background:var(--surface2);color:var(--text);
    border-radius:12px;padding:12px 14px;font-size:16px;outline:none;min-height:74px;resize:vertical;font-family:inherit;line-height:1.5
  }
  .field textarea:focus{border-color:var(--accent)}
  .filebtn{
    display:inline-flex;align-items:center;gap:8px;background:var(--empty);color:var(--text);
    border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer
  }
  .filebtn:active{transform:scale(.97)}
  .thumb{max-width:100%;border-radius:12px;margin-top:11px;display:block;max-height:220px;object-fit:cover}
  .photo-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .photo-del{border:none;background:transparent;color:var(--danger);font-size:13.5px;font-weight:700}
  .row{display:flex;gap:10px;margin-top:6px}
  .btn{flex:1;border:none;border-radius:13px;padding:14px;font-size:15.5px;font-weight:800;text-align:center;line-height:1.2}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 20px rgba(217,119,6,.35)}
  .btn.ghost{background:var(--empty);color:var(--text)}
  .btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
  .btn:active{transform:scale(.97)}
  .sheet .list-item{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;background:transparent;
    padding:14px 4px;font-size:15px;font-weight:600;border-bottom:1px solid var(--line)
  }
  .sheet .list-item:last-child{border-bottom:none}
  .sheet .list-item .ic{font-size:19px;width:24px;text-align:center}
  .sheet .list-item.danger{color:var(--danger)}
  .about{font-size:12.5px;color:var(--muted);line-height:1.7}
  .about a{color:var(--accent);font-weight:700;text-decoration:none}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <img class="logo" src="icon-192.png" alt="" width="34" height="34">
      <h1>しまい場所メモ</h1>
    </div>
    <button class="icon-btn" data-act="settings" aria-label="設定">⚙️</button>
  </header>
  <div class="search" id="searchbar">
    <span class="mag" aria-hidden="true">🔍</span>
    <input type="text" id="q" placeholder="名前・場所・メモで探す" autocomplete="off" aria-label="検索">
    <button class="clr" id="clr" data-act="clear-q" aria-label="クリア">✕</button>
  </div>
  <main id="list" aria-live="polite"></main>
</div>

<button class="fab" id="fab" data-act="add"><span class="plus">＋</span>追加</button>
<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
  "use strict";
  var KEY = "shimai.v1";
  var PRESETS = ["パスポート","実印","冬物","予備電池","年賀状","工具"];

  /* ---------- pure helpers ---------- */
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }

  /* ---------- storage ---------- */
  var db = load();
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if (raw){ var o = JSON.parse(raw); if (o && o.items) return o; }
    }catch(e){}
    return { version: 1, items: [] };
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
  function uid(){ return "s" + Date.now().toString(36) + Math.floor(Math.random()*1e5).toString(36); }
  function getItem(id){ for (var i=0;i<db.items.length;i++){ if (db.items[i].id===id) return db.items[i]; } return null; }

  /* ---------- rendering ---------- */
  var listEl = document.getElementById("list");
  var searchEl = document.getElementById("searchbar");
  var qEl = document.getElementById("q");
  var clrEl = document.getElementById("clr");
  var query = "";

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

  function sorted(){
    return db.items.slice().sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
  }
  function matches(it, q){
    var hay = ((it.name||"") + " " + (it.place||"") + " " + (it.note||"")).toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  function itemHtml(it){
    var placeHtml = it.place
      ? '<div class="place">📍 ' + esc(it.place) + '</div>'
      : '<div class="place none">📍 場所は未設定（タップで入力）</div>';
    var noteHtml = it.note ? '<div class="note">' + esc(String(it.note).replace(/\s+/g," ")) + '</div>' : '';
    var lead = it.photo
      ? '<img class="thumb" style="width:48px;height:48px;margin:0;border-radius:12px" src="' + it.photo + '" alt="">'
      : '<span class="ic">📦</span>';
    return '' +
      '<button class="item" data-act="edit" data-id="' + it.id + '">' +
        lead +
        '<div class="main">' +
          '<div class="name">' + esc(it.name) + '</div>' +
          placeHtml +
          noteHtml +
        '</div>' +
        '<span class="chev" aria-hidden="true">›</span>' +
      '</button>';
  }

  function emptyHtml(){
    return '' +
      '<div class="empty-state">' +
        '<div class="em">📦</div>' +
        '<h2>しまった場所を記録</h2>' +
        '<p>「どこにしまったっけ？」をなくす。まずは名前だけ登録して、あとから場所を書き足せます。</p>' +
        '<div class="chips">' +
          PRESETS.map(function(n){ return '<button class="chip" data-act="quick" data-name="' + esc(n) + '">＋ ' + esc(n) + '</button>'; }).join("") +
        '</div>' +
        '<div class="chip-hint">タップですぐ追加 → あとで場所を入力</div>' +
      '</div>';
  }

  function render(){
    var total = db.items.length;
    if (total === 0){
      searchEl.style.display = "none";
      listEl.innerHTML = emptyHtml();
      return;
    }
    searchEl.style.display = "flex";
    clrEl.classList.toggle("on", query.length > 0);
    var rows = sorted();
    if (query){ rows = rows.filter(function(it){ return matches(it, query); }); }
    var countTxt = query
      ? rows.length + " 件 / 全 " + total + " 件"
      : "全 " + total + " 件";
    var body;
    if (rows.length === 0){
      body = '<div class="nomatch">「' + esc(qEl.value) + '」に一致するものはありません</div>';
    } else {
      body = rows.map(itemHtml).join("");
    }
    listEl.innerHTML = '<div class="count">' + countTxt + '</div>' + body;
  }

  qEl.addEventListener("input", function(){
    query = (qEl.value || "").trim().toLowerCase();
    render();
  });

  /* ---------- modal plumbing ---------- */
  var overlay = document.getElementById("overlay");
  var sheet = document.getElementById("sheet");
  function openSheet(html){ sheet.innerHTML = '<div class="grip"></div>' + html; overlay.classList.add("on"); }
  function closeSheet(){ overlay.classList.remove("on"); }
  overlay.addEventListener("click", function(e){ if (e.target === overlay) closeSheet(); });

  /* ---------- add / edit form ---------- */
  var form = { photo: null };

  function itemForm(it){
    form.photo = it ? (it.photo || null) : null;
    var name = it ? it.name : "";
    var place = it ? (it.place || "") : "";
    var note = it ? (it.note || "") : "";
    var photoBlock = form.photo
      ? '<div class="photo-row"><label class="filebtn">📷 写真を変える<input type="file" id="f-photo" accept="image/*" style="display:none"></label>' +
          '<button class="photo-del" data-act="photo-del">写真を削除</button></div>' +
          '<img class="thumb" id="photo-preview" src="' + form.photo + '" alt="写真プレビュー">'
      : '<div class="photo-row"><label class="filebtn">📷 写真を選ぶ<input type="file" id="f-photo" accept="image/*" style="display:none"></label></div>' +
          '<div id="photo-preview"></div>';
    openSheet(
      '<h3>' + (it ? "しまい場所を編集" : "しまい場所を追加") + '</h3>' +
      '<div class="field"><label>名前<span class="req">*</span></label>' +
        '<input type="text" id="f-name" maxlength="40" placeholder="例：パスポート" value="' + esc(name) + '"></div>' +
      '<div class="field"><label>しまった場所</label>' +
        '<input type="text" id="f-place" maxlength="60" placeholder="例：寝室クローゼット 上段の箱" value="' + esc(place) + '"></div>' +
      '<div class="field"><label>メモ（任意）</label>' +
        '<textarea id="f-note" maxlength="200" placeholder="例：更新は2028年まで。予備の鍵も同じ箱。">' + esc(note) + '</textarea></div>' +
      '<div class="field"><label>写真（任意）</label>' + photoBlock + '</div>' +
      '<div class="row">' +
        '<button class="btn ghost" data-act="close">キャンセル</button>' +
        '<button class="btn primary" data-act="' + (it ? "save-edit" : "save-add") + '" data-id="' + (it ? it.id : "") + '">保存</button>' +
      '</div>' +
      (it ? '<div class="row"><button class="btn danger" data-act="delete" data-id="' + it.id + '">🗑️ 削除する</button></div>' : '')
    );
    var fp = document.getElementById("f-photo");
    if (fp) fp.addEventListener("change", handlePhoto);
    setTimeout(function(){ if (!it){ var n = document.getElementById("f-name"); if (n) n.focus(); } }, 60);
  }

  function handlePhoto(ev){
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var max = 1000, w = img.width, h = img.height;
        if (w >= h){ if (w > max){ h = Math.round(h * max / w); w = max; } }
        else { if (h > max){ w = Math.round(w * max / h); h = max; } }
        var cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        try{ form.photo = cv.toDataURL("image/jpeg", 0.7); }catch(e){ return; }
        var pv = document.getElementById("photo-preview");
        if (pv){ pv.outerHTML = '<img class="thumb" id="photo-preview" src="' + form.photo + '" alt="写真プレビュー">'; }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  /* ---------- settings ---------- */
  function settingsSheet(){
    var n = db.items.length;
    var withPlace = db.items.filter(function(it){ return it.place; }).length;
    openSheet(
      '<h3>設定</h3>' +
      '<button class="list-item" data-act="export"><span class="ic">⬇️</span>データを書き出す (JSON)</button>' +
      '<button class="list-item danger" data-act="wipe"><span class="ic">🗑️</span>すべてのデータを削除</button>' +
      '<div class="about" style="margin-top:16px">' +
        '<p><b>しまい場所メモ</b> 登録 ' + n + ' 件 / 場所入力済み ' + withPlace + ' 件</p>' +
        '<p>写真を含むすべてのデータは、この端末内にのみ保存され、外部へ送信されません。' +
        '<a href="../../privacy-shimai-memo.html">プライバシーポリシー</a></p>' +
        '<p style="opacity:.7">ver 1.0.0</p>' +
      '</div>'
    );
  }

  /* ---------- actions ---------- */
  document.body.addEventListener("click", function(ev){
    var el = ev.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");
    var id = el.getAttribute("data-id");
    var it = id ? getItem(id) : null;

    switch(act){
      case "add": itemForm(null); break;
      case "edit": itemForm(it); break;
      case "settings": settingsSheet(); break;
      case "close": closeSheet(); break;

      case "clear-q": {
        query = ""; qEl.value = ""; render(); qEl.focus();
        break;
      }
      case "quick": {
        var nm = el.getAttribute("data-name") || "";
        db.items.push({ id: uid(), name: nm, place: "", note: "", photo: null, createdAt: Date.now() });
        save(); render();
        break;
      }
      case "photo-del": {
        form.photo = null;
        var pv = document.getElementById("photo-preview");
        if (pv) pv.outerHTML = '<div id="photo-preview"></div>';
        var pr = el.closest(".photo-row");
        var delBtn = pr ? pr.querySelector(".photo-del") : null;
        if (delBtn) delBtn.style.display = "none";
        var lbl = pr ? pr.querySelector(".filebtn") : null;
        if (lbl) lbl.firstChild.nodeValue = "📷 写真を選ぶ";
        break;
      }
      case "save-add": {
        var nameA = (document.getElementById("f-name").value || "").trim();
        if (!nameA){ flagName(); break; }
        db.items.push({
          id: uid(), name: nameA,
          place: (document.getElementById("f-place").value || "").trim(),
          note: (document.getElementById("f-note").value || "").trim(),
          photo: form.photo, createdAt: Date.now()
        });
        save(); closeSheet(); render();
        break;
      }
      case "save-edit": {
        var nameE = (document.getElementById("f-name").value || "").trim();
        if (!nameE){ flagName(); break; }
        if (it){
          it.name = nameE;
          it.place = (document.getElementById("f-place").value || "").trim();
          it.note = (document.getElementById("f-note").value || "").trim();
          it.photo = form.photo;
          save();
        }
        closeSheet(); render();
        break;
      }
      case "delete": {
        if (it && confirm("「" + it.name + "」を削除します。よろしいですか？")){
          db.items = db.items.filter(function(x){ return x.id !== id; });
          save(); closeSheet(); render();
        }
        break;
      }
      case "export": {
        var blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = "shimai-basho-backup-" + todayStr() + ".json";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
        break;
      }
      case "wipe": {
        if (confirm("登録したすべてのしまい場所を削除します。元に戻せません。よろしいですか？")){
          db = { version: 1, items: [] };
          query = ""; qEl.value = "";
          save(); closeSheet(); render();
        }
        break;
      }
    }
  });

  function flagName(){
    var f = document.getElementById("f-name");
    if (f){ f.classList.add("err"); f.focus(); }
  }

  /* ---------- boot ---------- */
  render();

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }

  window.__shimai = { todayStr: todayStr, matches: matches };
})();
</script>
