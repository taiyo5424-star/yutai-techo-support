<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3f7fd0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="子どもの提出物・集金・行事の締切をまとめて管理。出し忘れを防ぎます。">
<title>学校の提出物メモ｜締切と集金の管理</title>
<style>
  :root{
    --accent:#3f7fd0; --accent-d:#3167ac; --accent-soft:#eaf2fb;
    --bg:#faf7f5; --card:#ffffff; --text:#2b2622; --sub:#8a827b;
    --line:#eee6e0; --ok:#3fa66a; --warn:#e0952b; --danger:#d9534f;
    --radius:16px; --shadow:0 2px 12px rgba(80,60,50,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#18140f; --card:#241e18; --text:#f2ece6; --sub:#a89f96;
      --line:#372f27; --accent-soft:#182839; --shadow:0 2px 12px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;
    padding-bottom:env(safe-area-inset-bottom);-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--accent),var(--accent-d));
    color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));
    display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  header .ico{font-size:24px;line-height:1}
  header h1{font-size:18px;margin:0;font-weight:700;flex:1}
  header button.gear{background:rgba(255,255,255,.2);border:0;color:#fff;font-size:18px;
    width:36px;height:36px;border-radius:50%;cursor:pointer}
  main{max-width:640px;margin:0 auto;padding:16px 16px 28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  h2{font-size:15px;margin:0 0 12px;color:var(--sub);font-weight:700;letter-spacing:.02em}
  .btn{appearance:none;border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:transform .05s,filter .15s;width:100%}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{filter:brightness(1.05)}
  .btn-ghost{background:var(--accent-soft);color:var(--accent-d)}
  .btn-sm{width:auto;padding:8px 14px;font-size:14px;border-radius:10px}
  input,select,textarea{font-family:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);color:var(--text);width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
  .row{display:flex;gap:8px;align-items:center}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:13px;color:var(--sub);font-weight:700;margin-bottom:5px}
  .field label .req{color:var(--danger);font-weight:700}
  /* 要約 */
  .stats{display:flex;gap:10px;margin-bottom:14px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 12px;box-shadow:var(--shadow)}
  .stat .lbl{font-size:12px;color:var(--sub);font-weight:700}
  .stat .num{font-size:24px;font-weight:800;margin-top:2px;color:var(--accent-d)}
  .stat .num .u{font-size:13px;font-weight:700;color:var(--sub);margin-left:2px}
  .stat.alert{background:var(--accent-soft);border-color:var(--accent)}
  .stat.alert .num{color:var(--danger)}
  /* 一覧 */
  ul.list{list-style:none;margin:0;padding:0}
  ul.list li{display:flex;align-items:flex-start;gap:11px;padding:12px 4px;border-bottom:1px solid var(--line)}
  ul.list li:last-child{border-bottom:0}
  ul.list li .chk{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--accent);cursor:pointer}
  ul.list li .body{flex:1;min-width:0}
  ul.list li .ttl{font-weight:700;word-break:break-word}
  ul.list li .meta{font-size:12px;color:var(--sub);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .kind{font-size:12px;font-weight:700;padding:1px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent-d)}
  .kind.k-syu{background:var(--accent-soft);color:var(--accent-d)}
  .kind.k-shu{background:#eaf7ee;color:#2f8a54}
  .kind.k-gyo{background:#f6eefb;color:#8a4fb0}
  .kind.k-mot{background:#fff4e6;color:#b5762a}
  @media (prefers-color-scheme: dark){
    .kind.k-shu{background:#1c3325;color:#7fd39d}
    .kind.k-gyo{background:#2b2135;color:#c99fe0}
    .kind.k-mot{background:#33291a;color:#e0b57f}
  }
  .child{background:var(--bg);padding:1px 8px;border-radius:20px}
  .yen{color:var(--warn);font-weight:700}
  .due{font-weight:700;padding:1px 8px;border-radius:20px;background:var(--bg);color:var(--sub)}
  .due.over{background:#fdecec;color:var(--danger)}
  .due.soon{background:#fff4e2;color:#b5762a}
  @media (prefers-color-scheme: dark){
    .due.over{background:#3a1f1f}
    .due.soon{background:#33291a}
  }
  li.done .ttl{text-decoration:line-through;color:var(--sub)}
  li.done{opacity:.62}
  .del{background:none;border:0;color:var(--danger);font-size:18px;cursor:pointer;padding:4px 8px;flex:none}
  .empty{text-align:center;color:var(--sub);padding:20px 8px;font-size:14px}
  .sec-lbl{font-size:12px;color:var(--sub);font-weight:700;margin:14px 0 2px;padding-left:4px}
  .ad-slot{margin:16px auto;max-width:640px;min-height:56px;border:1px dashed var(--line);border-radius:12px;
    display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px;background:var(--card)}
  footer{max-width:640px;margin:0 auto;padding:18px 16px 34px;color:var(--sub);font-size:12px;text-align:center}
  footer a{color:var(--sub)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal.open{display:flex}
  .sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
  .sheet h3{margin:0 0 12px;font-size:17px}
  .sheet .btn{margin-top:8px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#2b2622;color:#fff;
    padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <span class="ico">🎒</span>
  <h1>学校の提出物メモ</h1>
  <button class="gear" id="gear" aria-label="設定">⚙️</button>
</header>

<main>
  <div class="stats">
    <div class="stat alert" id="statSoon">
      <div class="lbl">まもなく締切</div>
      <div class="num"><span id="soonNum">0</span><span class="u">件</span></div>
    </div>
    <div class="stat" id="statMoney">
      <div class="lbl">集金合計（未対応）</div>
      <div class="num"><span id="moneyNum">0</span><span class="u">円</span></div>
    </div>
  </div>

  <div class="ad-slot"><!-- AdMob等の広告をここに表示 -->広告スペース</div>

  <div class="card">
    <h2>予定を追加</h2>
    <form id="addForm" autocomplete="off">
      <div class="field">
        <label>内容 <span class="req">*</span></label>
        <input id="text" placeholder="例：家庭科の裁縫セット" maxlength="60" required>
      </div>
      <div class="row" style="gap:10px">
        <div class="field" style="flex:1;margin-bottom:11px">
          <label>種別</label>
          <select id="kind">
            <option value="提出物">提出物</option>
            <option value="集金">集金</option>
            <option value="行事">行事</option>
            <option value="持ち物">持ち物</option>
          </select>
        </div>
        <div class="field" style="flex:1;margin-bottom:11px">
          <label>子どもの名前</label>
          <input id="child" placeholder="例：太郎" maxlength="20">
        </div>
      </div>
      <div class="row" style="gap:10px">
        <div class="field" style="flex:1;margin-bottom:11px">
          <label>締切日 <span class="req">*</span></label>
          <input id="due" type="date" required>
        </div>
        <div class="field" id="amtWrap" style="flex:1;margin-bottom:11px;display:none">
          <label>金額（円）</label>
          <input id="amount" type="number" inputmode="numeric" min="0" placeholder="例：500">
        </div>
      </div>
      <button class="btn btn-primary" type="submit">追加する</button>
    </form>
  </div>

  <div class="card">
    <h2>予定一覧</h2>
    <ul class="list" id="list"></ul>
    <div id="doneWrap"></div>
    <p class="empty" id="empty">まだ予定がありません。提出物や集金、行事の締切を追加しておくと出し忘れを防げます。</p>
  </div>
</main>

<footer>
  <p>データはこの端末内にのみ保存されます。外部送信はありません。</p>
  <p><a href="../../privacy-gakko-memo.html">プライバシーポリシー</a>　|　<a href="../index.html">アプリ一覧</a></p>
  <p>© 学校の提出物メモ</p>
</footer>

<div class="modal" id="modal">
  <div class="sheet">
    <h3>設定</h3>
    <button class="btn btn-ghost" id="export">データを書き出す（バックアップ）</button>
    <button class="btn btn-ghost" id="closeModal">閉じる</button>
    <button class="btn" id="clear" style="background:var(--danger);color:#fff">すべてのデータを削除</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var KEY="gakko-memo";
  // ---- storage helper (shared pattern across all apps) ----
  var store={
    get:function(k,d){ try{var v=localStorage.getItem(KEY+":"+k);return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set:function(k,v){ try{localStorage.setItem(KEY+":"+k,JSON.stringify(v));}catch(e){} },
    del:function(){ try{Object.keys(localStorage).forEach(function(x){if(x.indexOf(KEY+":")===0)localStorage.removeItem(x);});}catch(e){} }
  };
  function $(s){return document.querySelector(s);}
  function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show");},1800);}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function yen(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,","); }

  function daysUntil(due){
    if(!due)return null;
    var p=String(due).split("-"); if(p.length!==3)return null;
    var d=new Date(+p[0],+p[1]-1,+p[2]);
    var now=new Date(); var t=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    return Math.round((d-t)/86400000);
  }
  function dueInfo(n){
    if(n===null)return {label:"",cls:""};
    if(n<0) return {label:"期限切れ",cls:"over"};
    if(n===0)return {label:"今日まで",cls:"over"};
    if(n<=3) return {label:"あと"+n+"日",cls:"soon"};
    return {label:"あと"+n+"日",cls:""};
  }
  var KIND_CLS={"提出物":"k-syu","集金":"k-shu","行事":"k-gyo","持ち物":"k-mot"};
  var KIND_ICO={"提出物":"📄","集金":"💰","行事":"🎪","持ち物":"🎒"};

  var items=store.get("items",[]); // {id,text,kind,child,due,amount,done}

  function save(){ store.set("items",items); }

  function liHtml(it){
    var n=daysUntil(it.due), di=dueInfo(n);
    var meta='';
    var kc=KIND_CLS[it.kind]||"k-syu";
    meta+='<span class="kind '+kc+'">'+esc((KIND_ICO[it.kind]||"")+" "+it.kind)+'</span>';
    if(it.child)meta+='<span class="child">'+esc(it.child)+'さん</span>';
    if(it.kind==="集金"&&it.amount!=null&&it.amount!=="")meta+='<span class="yen">'+yen(it.amount)+'円</span>';
    if(di.label)meta+='<span class="due '+di.cls+'">'+esc(di.label)+'</span>';
    return '<li data-id="'+esc(it.id)+'"'+(it.done?' class="done"':'')+'>'+
      '<input type="checkbox" class="chk" data-act="chk"'+(it.done?' checked':'')+' aria-label="完了">'+
      '<div class="body"><div class="ttl">'+esc(it.text)+'</div>'+
      '<div class="meta">'+meta+'</div></div>'+
      '<button class="del" data-act="del" aria-label="削除">🗑</button></li>';
  }

  function render(){
    // summary
    var soon=0, money=0;
    items.forEach(function(it){
      if(!it.done){
        var n=daysUntil(it.due);
        if(n!==null && n<=3)soon++;
        if(it.kind==="集金"&&it.amount!=null&&it.amount!=="")money+=(+it.amount||0);
      }
    });
    $("#soonNum").textContent=soon;
    $("#moneyNum").textContent=yen(money);
    $("#statSoon").classList.toggle("alert", soon>0);

    var active=items.filter(function(i){return !i.done;})
      .sort(function(a,b){ return (a.due||"9999").localeCompare(b.due||"9999"); });
    var done=items.filter(function(i){return i.done;})
      .sort(function(a,b){ return (b.due||"").localeCompare(a.due||""); });

    $("#list").innerHTML=active.map(liHtml).join("");
    var dw=$("#doneWrap");
    dw.innerHTML = done.length
      ? '<div class="sec-lbl">完了（'+done.length+'）</div><ul class="list">'+done.map(liHtml).join("")+'</ul>'
      : '';

    $("#empty").style.display=items.length?"none":"block";
  }

  // 集金のときだけ金額欄を表示
  function syncAmt(){ $("#amtWrap").style.display = $("#kind").value==="集金" ? "block" : "none"; }
  $("#kind").addEventListener("change",syncAmt);

  // 追加
  $("#addForm").addEventListener("submit",function(e){
    e.preventDefault();
    var t=$("#text").value.trim(); if(!t){toast("内容を入力してください");return;}
    var due=$("#due").value; if(!due){toast("締切日を選んでください");return;}
    var kind=$("#kind").value;
    var amt=(kind==="集金")?($("#amount").value.trim()===""?null:Math.max(0,parseInt($("#amount").value,10)||0)):null;
    items.push({
      id:Date.now()+"-"+Math.floor(performance.now()),
      text:t, kind:kind, child:$("#child").value.trim(),
      due:due, amount:amt, done:false
    });
    save();
    $("#text").value=""; $("#child").value=""; $("#amount").value="";
    render(); toast("追加しました");
  });

  // 完了 / 削除
  function onListClick(e){
    var b=e.target.closest("[data-act]"); if(!b)return;
    var li=e.target.closest("li"); if(!li)return;
    var id=li.getAttribute("data-id");
    var act=b.getAttribute("data-act");
    if(act==="del"){
      items=items.filter(function(i){return String(i.id)!==String(id);});
      save(); render(); toast("削除しました");
    }else if(act==="chk"){
      items.forEach(function(i){ if(String(i.id)===String(id))i.done=!i.done; });
      save(); render();
    }
  }
  $("#list").addEventListener("click",onListClick);
  $("#doneWrap").addEventListener("click",onListClick);

  // 設定モーダル
  $("#gear").addEventListener("click",function(){$("#modal").classList.add("open");});
  $("#closeModal").addEventListener("click",function(){$("#modal").classList.remove("open");});
  $("#modal").addEventListener("click",function(e){if(e.target===this)this.classList.remove("open");});
  $("#export").addEventListener("click",function(){
    var data=JSON.stringify({items:items},null,2);
    try{
      var b=new Blob([data],{type:"application/json"});
      var a=document.createElement("a");a.href=URL.createObjectURL(b);
      a.download="gakko-memo-backup.json";a.click();
    }catch(e){ prompt("以下をコピーして保存してください",data); }
  });
  $("#clear").addEventListener("click",function(){
    if(confirm("すべての予定を削除します。よろしいですか？")){
      store.del(); items=[]; render(); $("#modal").classList.remove("open");
      toast("削除しました");
    }
  });

  // 初期化
  syncAmt();
  render();
})();
</script>
</body>
</html>
