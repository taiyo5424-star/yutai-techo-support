<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おかいものメモ</title>
<meta name="description" content="買うものをサッと書いてタップでチェックできる、シンプルな買い物リスト。会員登録不要・完全ローカル保存。">
<meta name="theme-color" content="#0ea5e9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="おかいもの">
<style>
  :root{
    --accent:#0ea5e9; --accent2:#0284c7;
    --bg:#f4f6f8; --surface:#ffffff; --surface2:#f8fafc;
    --text:#0f172a; --muted:#64748b; --line:#e6e9ee; --empty:#eceff3;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
    --danger:#ef4444;
    --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1220; --surface:#131c2b; --surface2:#0f1826;
      --text:#e7ecf3; --muted:#94a3b8; --line:#25324a; --empty:#1b2536;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;color:inherit;cursor:pointer}
  input{font-family:inherit}
  .app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px calc(28px + var(--safe-b))}
  /* header */
  header{
    position:sticky;top:0;z-index:20;background:var(--bg);
    padding:calc(12px + var(--safe-t)) 0 10px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .logo{width:34px;height:34px;border-radius:9px;flex:0 0 auto;box-shadow:0 2px 6px rgba(2,132,199,.35)}
  .brand h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.01em;white-space:nowrap}
  .icon-btn{
    width:40px;height:40px;border:none;border-radius:12px;background:var(--surface);
    box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px;flex:0 0 auto
  }
  .icon-btn:active{transform:scale(.94)}
  /* add bar */
  .addbar{display:flex;gap:8px;margin:2px 0 8px}
  .addbar input{
    flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);color:var(--text);
    border-radius:13px;padding:13px 14px;font-size:16px;outline:none;box-shadow:var(--shadow)
  }
  .addbar input:focus{border-color:var(--accent)}
  .addbar button{
    flex:0 0 auto;border:none;border-radius:13px;padding:0 20px;font-size:15px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 16px rgba(2,132,199,.35)
  }
  .addbar button:active{transform:scale(.96)}
  /* count summary */
  .count{font-size:12.5px;color:var(--muted);font-weight:700;margin:2px 2px 14px;min-height:16px}
  .count b{color:var(--text);font-weight:800}
  .count .ok{color:var(--accent2)}
  /* list rows */
  .item{
    display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:6px 8px 6px 6px;margin-bottom:10px;box-shadow:var(--shadow)
  }
  .check{width:44px;height:44px;flex:0 0 auto;border:none;background:transparent;display:grid;place-items:center}
  .check i{
    width:25px;height:25px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;
    font-size:14px;font-style:normal;color:transparent;transition:background .15s ease,border-color .15s ease
  }
  .item.done .check i{background:var(--accent);border-color:var(--accent);color:#fff}
  .nm{flex:1;min-width:0;font-size:15.5px;font-weight:600;padding:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item.done .nm{text-decoration:line-through;color:var(--muted)}
  .del{
    border:none;background:transparent;color:var(--muted);font-size:22px;line-height:1;
    width:44px;height:44px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center
  }
  .del:active{background:var(--empty)}
  .clear-done{
    width:100%;border:1px solid var(--line);background:var(--surface);color:var(--muted);
    border-radius:12px;padding:12px;font-size:14px;font-weight:700;margin:2px 0 4px;box-shadow:var(--shadow)
  }
  .clear-done:active{transform:scale(.98)}
  /* empty state */
  .empty-state{text-align:center;padding:26px 10px 8px;color:var(--muted)}
  .empty-state .em{font-size:44px}
  .empty-state h2{color:var(--text);font-size:17px;margin:10px 0 4px}
  .empty-state p{font-size:13.5px;margin:0 auto;max-width:290px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
  .chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 15px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow)}
  .chip:active{transform:scale(.96)}
  /* overlay + sheet */
  .overlay{
    position:fixed;inset:0;z-index:50;background:rgba(9,14,24,.5);
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .2s ease;backdrop-filter:blur(2px)
  }
  .overlay.on{opacity:1;pointer-events:auto}
  .sheet{
    width:100%;max-width:520px;background:var(--surface);
    border-radius:22px 22px 0 0;padding:8px 18px calc(20px + var(--safe-b));
    box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(20px);transition:transform .22s ease;
    max-height:92vh;overflow:auto
  }
  .overlay.on .sheet{transform:translateY(0)}
  .grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 12px}
  .sheet h3{margin:2px 0 14px;font-size:18px;font-weight:800}
  .sheet .list-item{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;background:transparent;
    padding:15px 4px;font-size:15px;font-weight:600;border-bottom:1px solid var(--line)
  }
  .sheet .list-item:last-child{border-bottom:none}
  .sheet .list-item .ic{font-size:19px;width:24px;text-align:center}
  .sheet .list-item.danger{color:var(--danger)}
  .about{font-size:12.5px;color:var(--muted);line-height:1.7}
  .about a{color:var(--accent);font-weight:700;text-decoration:none}
  .pop{animation:pop .28s ease}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <img class="logo" src="icon-192.png" alt="" width="34" height="34">
      <h1>おかいものメモ</h1>
    </div>
    <button class="icon-btn" data-act="settings" aria-label="設定">⚙️</button>
  </header>
  <div class="addbar">
    <input type="text" id="add-input" maxlength="40" placeholder="買うものを入力" enterkeyhint="done" autocomplete="off" aria-label="買うもの">
    <button data-act="add-item">追加</button>
  </div>
  <div class="count" id="count"></div>
  <main id="list" aria-live="polite"></main>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
  "use strict";
  var KEY = "kaimono.v1";
  var PRESETS = [
    {name:"牛乳",emoji:"🥛"},
    {name:"卵",emoji:"🥚"},
    {name:"パン",emoji:"🍞"},
    {name:"お米",emoji:"🍚"},
    {name:"ヨーグルト",emoji:"🥣"},
    {name:"ティッシュ",emoji:"🧻"},
    {name:"野菜",emoji:"🥬"},
    {name:"洗剤",emoji:"🧴"}
  ];

  /* ---------- date helpers ---------- */
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function parse(s){ var a = s.split("-"); return new Date(+a[0], +a[1]-1, +a[2]); }
  function addDays(s, delta){
    var d = parse(s); d.setDate(d.getDate() + delta);
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }

  /* ---------- storage ---------- */
  var db = load();
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if (raw){ var o = JSON.parse(raw); if (o && o.items) return o; }
    }catch(e){}
    return { version: 1, items: [] };
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
  function uid(){ return "i" + Date.now().toString(36) + Math.floor(Math.random()*1e5).toString(36); }
  function getItem(id){ for (var i=0;i<db.items.length;i++){ if (db.items[i].id===id) return db.items[i]; } return null; }

  /* ---------- rendering ---------- */
  var listEl = document.getElementById("list");
  var countEl = document.getElementById("count");
  var inputEl = document.getElementById("add-input");

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

  function render(){
    renderCount();
    renderList();
  }

  function renderCount(){
    var total = db.items.length;
    if (total === 0){ countEl.innerHTML = ""; return; }
    var remain = 0;
    for (var i=0;i<total;i++){ if (!db.items[i].done) remain++; }
    if (remain === 0){
      countEl.innerHTML = '残り <b>0</b> 個 / 全 <b>' + total + '</b> 個 <span class="ok">・そろいました🎉</span>';
    } else {
      countEl.innerHTML = '残り <b>' + remain + '</b> 個 / 全 <b>' + total + '</b> 個';
    }
  }

  function renderList(){
    if (db.items.length === 0){
      listEl.innerHTML =
        '<div class="empty-state">' +
          '<div class="em">🛒</div>' +
          '<h2>買うものをメモしよう</h2>' +
          '<p>上のバーに入力して追加。よく買う物はタップですぐ追加できます。</p>' +
          '<div class="chips">' +
            PRESETS.map(function(p,i){ return '<button class="chip" data-act="quick" data-i="' + i + '">' + p.emoji + ' ' + esc(p.name) + '</button>'; }).join("") +
          '</div>' +
        '</div>';
      return;
    }
    var html = "";
    var anyDone = false;
    for (var i=0;i<db.items.length;i++){
      var it = db.items[i];
      if (it.done) anyDone = true;
      html +=
        '<div class="item' + (it.done ? " done" : "") + '" data-id="' + it.id + '">' +
          '<button class="check" data-act="toggle" data-id="' + it.id + '" aria-label="' + (it.done ? "未購入に戻す" : "購入済みにする") + '"><i>✓</i></button>' +
          '<span class="nm">' + esc(it.name) + '</span>' +
          '<button class="del" data-act="del" data-id="' + it.id + '" aria-label="削除">×</button>' +
        '</div>';
    }
    if (anyDone){
      html += '<button class="clear-done" data-act="clear-done">チェック済みを消す</button>';
    }
    listEl.innerHTML = html;
  }

  /* ---------- modal plumbing ---------- */
  var overlay = document.getElementById("overlay");
  var sheet = document.getElementById("sheet");
  function openSheet(html){ sheet.innerHTML = '<div class="grip"></div>' + html; overlay.classList.add("on"); }
  function closeSheet(){ overlay.classList.remove("on"); }
  overlay.addEventListener("click", function(e){ if (e.target === overlay) closeSheet(); });

  function settingsSheet(){
    var total = db.items.length;
    var done = 0;
    db.items.forEach(function(it){ if (it.done) done++; });
    openSheet(
      '<h3>設定</h3>' +
      '<button class="list-item" data-act="export"><span class="ic">⬇️</span>データを書き出す (JSON)</button>' +
      '<button class="list-item danger" data-act="wipe"><span class="ic">🗑️</span>すべてのデータを削除</button>' +
      '<div class="about" style="margin-top:16px">' +
        '<p><b>おかいものメモ</b> 全 ' + total + ' 個 / チェック済み ' + done + ' 個</p>' +
        '<p>データはこの端末内にのみ保存され、外部へ送信されません。' +
        '<a href="../../privacy-kaimono-memo.html">プライバシーポリシー</a></p>' +
        '<p style="opacity:.7">ver 1.0.0</p>' +
      '</div>'
    );
  }

  /* ---------- actions ---------- */
  function addItem(name){
    name = (name || "").trim();
    if (!name) return false;
    db.items.push({ id: uid(), name: name, done: false, createdAt: todayStr() });
    save();
    return true;
  }

  function submitInput(){
    if (addItem(inputEl.value)){
      inputEl.value = "";
      render();
      inputEl.focus();
    }
  }

  inputEl.addEventListener("keydown", function(ev){
    if (ev.key === "Enter"){ ev.preventDefault(); submitInput(); }
  });

  document.body.addEventListener("click", function(ev){
    var el = ev.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");
    var id = el.getAttribute("data-id");
    var it = id ? getItem(id) : null;

    switch(act){
      case "add-item": submitInput(); break;
      case "quick": {
        var p = PRESETS[+el.getAttribute("data-i")];
        addItem(p.name); render();
        break;
      }
      case "toggle": {
        if (it){
          it.done = !it.done; save();
          var ic = el.querySelector("i");
          if (ic){ ic.classList.remove("pop"); void ic.offsetWidth; ic.classList.add("pop"); }
          render();
        }
        break;
      }
      case "del": {
        db.items = db.items.filter(function(x){ return x.id !== id; });
        save(); render();
        break;
      }
      case "clear-done": {
        var doneCount = db.items.filter(function(x){ return x.done; }).length;
        if (doneCount === 0) break;
        if (confirm("チェック済みの " + doneCount + " 個を消します。よろしいですか？")){
          db.items = db.items.filter(function(x){ return !x.done; });
          save(); render();
        }
        break;
      }
      case "settings": settingsSheet(); break;
      case "close": closeSheet(); break;
      case "export": {
        var blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = "kaimono-backup-" + todayStr() + ".json";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
        break;
      }
      case "wipe": {
        if (confirm("すべての買い物リストを削除します。元に戻せません。よろしいですか？")){
          db = { version: 1, items: [] }; save(); closeSheet(); render();
        }
        break;
      }
    }
  });

  /* ---------- boot ---------- */
  render();

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }

  window.__kaimono = { addDays: addDays, todayStr: todayStr, addItem: addItem };
})();
</script>
</body>
</html>
