<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>とめた場所メモ</title>
<meta name="description" content="クルマを停めた場所をメモ・現在地・写真で記録。あとで迷わず戻れる駐車位置メモ。会員登録不要・完全ローカル保存。">
<meta name="theme-color" content="#14b8a6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="とめた場所">
<style>
  :root{
    --accent:#14b8a6; --accent2:#0d9488;
    --bg:#f4f6f8; --surface:#ffffff; --surface2:#f8fafc;
    --text:#0f172a; --muted:#64748b; --line:#e6e9ee; --empty:#eceff3;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
    --danger:#ef4444;
    --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1220; --surface:#131c2b; --surface2:#0f1826;
      --text:#e7ecf3; --muted:#94a3b8; --line:#25324a; --empty:#1b2536;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;color:inherit;cursor:pointer}
  .app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px calc(96px + var(--safe-b))}
  /* header */
  header{
    position:sticky;top:0;z-index:20;background:var(--bg);
    padding:calc(12px + var(--safe-t)) 0 10px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .logo{width:34px;height:34px;border-radius:9px;flex:0 0 auto;box-shadow:0 2px 6px rgba(13,148,136,.35)}
  .brand h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.01em;white-space:nowrap}
  .icon-btn{
    width:40px;height:40px;border:none;border-radius:12px;background:var(--surface);
    box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px;flex:0 0 auto
  }
  .icon-btn:active{transform:scale(.94)}
  /* park card */
  .card{
    background:var(--surface);border-radius:18px;padding:14px;margin:4px 0 14px;
    box-shadow:var(--shadow);border:1px solid var(--line);position:relative
  }
  .hero{
    display:flex;align-items:center;gap:13px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
    border-radius:14px;padding:15px 16px;box-shadow:0 8px 22px rgba(13,148,136,.28)
  }
  .hero .ic{font-size:30px;line-height:1;flex:0 0 auto}
  .hero .since{font-size:20px;font-weight:800;letter-spacing:.01em}
  .hero .at{font-size:12px;opacity:.92;font-weight:600;margin-top:2px}
  .park .note{
    margin-top:12px;font-size:15px;white-space:pre-wrap;word-break:break-word;
    background:var(--surface2);border-radius:12px;padding:11px 13px;border:1px solid var(--line)
  }
  .park .photo{width:100%;border-radius:14px;margin-top:12px;display:block;max-height:300px;object-fit:cover}
  .park .row{margin-top:14px}
  .clear-btn{width:100%;margin-top:10px}
  /* history */
  .hist-h{font-size:13px;font-weight:800;color:var(--muted);margin:14px 4px 9px}
  .hist-item{
    display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)
  }
  .h-thumb{width:46px;height:46px;border-radius:11px;object-fit:cover;flex:0 0 auto}
  .h-ic{width:46px;height:46px;border-radius:11px;background:var(--empty);display:grid;place-items:center;font-size:21px;flex:0 0 auto}
  .h-main{flex:1;min-width:0}
  .h-note{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .h-time{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:600}
  .h-map{flex:0 0 auto;text-decoration:none;font-size:20px;width:42px;height:42px;border-radius:11px;background:var(--empty);display:grid;place-items:center}
  .h-map:active{transform:scale(.94)}
  /* empty state */
  .empty-state{text-align:center;padding:34px 10px 8px;color:var(--muted)}
  .empty-state .em{font-size:52px}
  .empty-state h2{color:var(--text);font-size:18px;margin:12px 0 5px}
  .empty-state p{font-size:13.5px;margin:0 auto;max-width:280px}
  .bigbtn{
    display:block;width:100%;max-width:340px;margin:22px auto 0;border:none;border-radius:18px;
    padding:22px;font-size:18px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 12px 28px rgba(13,148,136,.42)
  }
  .bigbtn:active{transform:scale(.97)}
  /* FAB */
  .fab{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + var(--safe-b));
    z-index:30;border:none;border-radius:99px;padding:14px 22px;font-size:15px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 10px 26px rgba(13,148,136,.45);display:flex;align-items:center;gap:8px
  }
  .fab:active{transform:translateX(-50%) scale(.96)}
  .fab .plus{font-size:20px;line-height:1;margin-top:-1px}
  /* overlay + sheet */
  .overlay{
    position:fixed;inset:0;z-index:50;background:rgba(9,14,24,.5);
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .2s ease;backdrop-filter:blur(2px)
  }
  .overlay.on{opacity:1;pointer-events:auto}
  .sheet{
    width:100%;max-width:520px;background:var(--surface);
    border-radius:22px 22px 0 0;padding:8px 18px calc(20px + var(--safe-b));
    box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(20px);transition:transform .22s ease;
    max-height:92vh;overflow:auto
  }
  .overlay.on .sheet{transform:translateY(0)}
  .grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 12px}
  .sheet h3{margin:2px 0 14px;font-size:18px;font-weight:800}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:7px}
  .field textarea{
    width:100%;border:1.5px solid var(--line);background:var(--surface2);color:var(--text);
    border-radius:12px;padding:12px 14px;font-size:16px;outline:none;min-height:90px;resize:vertical;font-family:inherit;line-height:1.5
  }
  .field textarea:focus{border-color:var(--accent)}
  .filebtn{
    display:inline-flex;align-items:center;gap:8px;background:var(--empty);color:var(--text);
    border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer
  }
  .filebtn:active{transform:scale(.97)}
  .status{font-size:13px;color:var(--muted);margin-top:9px;min-height:18px;font-weight:600;word-break:break-word}
  .status.ok{color:var(--accent2)}
  .thumb{max-width:100%;border-radius:12px;margin-top:11px;display:block;max-height:220px;object-fit:cover}
  .row{display:flex;gap:10px;margin-top:6px}
  .btn{flex:1;border:none;border-radius:13px;padding:14px;font-size:15.5px;font-weight:800;text-align:center;text-decoration:none;line-height:1.2}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 20px rgba(13,148,136,.35)}
  .btn.ghost{background:var(--empty);color:var(--text)}
  .btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
  .btn:active{transform:scale(.97)}
  .sheet .list-item{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;background:transparent;
    padding:14px 4px;font-size:15px;font-weight:600;border-bottom:1px solid var(--line)
  }
  .sheet .list-item:last-child{border-bottom:none}
  .sheet .list-item .ic{font-size:19px;width:24px;text-align:center}
  .sheet .list-item.danger{color:var(--danger)}
  .about{font-size:12.5px;color:var(--muted);line-height:1.7}
  .about a{color:var(--accent);font-weight:700;text-decoration:none}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <img class="logo" src="icon-192.png" alt="" width="34" height="34">
      <h1>とめた場所メモ</h1>
    </div>
    <button class="icon-btn" data-act="settings" aria-label="設定">⚙️</button>
  </header>
  <main id="list" aria-live="polite"></main>
</div>

<button class="fab" id="fab" data-act="park"><span class="plus">＋</span>別の場所に停めた</button>
<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
  "use strict";
  var KEY = "parking.v1";
  var MAX_HIST = 20;

  /* ---------- pure helpers ---------- */
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function sinceLabel(ts){
    var min = Math.floor((Date.now() - ts) / 60000);
    if (min < 1) return "たった今駐車";
    if (min < 60) return min + "分前に駐車";
    var hr = Math.floor(min / 60), rm = min % 60;
    if (hr < 24) return hr + "時間" + (rm > 0 ? rm + "分" : "") + "前に駐車";
    var day = Math.floor(hr / 24);
    return day + "日前に駐車";
  }
  function fmtTime(ts){
    var d = new Date(ts);
    return (d.getMonth()+1) + "月" + d.getDate() + "日 " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function mapUrl(r){ return "https://www.google.com/maps?q=" + r.lat + "," + r.lng; }
  function hasLoc(r){ return r && r.lat != null && r.lng != null; }

  /* ---------- storage ---------- */
  var db = load();
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if (raw){ var o = JSON.parse(raw); if (o && ("current" in o)){ if (!o.history) o.history = []; return o; } }
    }catch(e){}
    return { version: 1, current: null, history: [] };
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }

  /* ---------- rendering ---------- */
  var listEl = document.getElementById("list");
  var fabEl = document.getElementById("fab");

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

  function currentHtml(){
    var c = db.current;
    var mapBtn = hasLoc(c)
      ? '<a class="btn primary" href="' + mapUrl(c) + '" target="_blank" rel="noopener">🗺️ 地図で開く</a>'
      : '';
    return '' +
      '<section class="card park">' +
        '<div class="hero">' +
          '<span class="ic">🅿️</span>' +
          '<div><div class="since">' + sinceLabel(c.ts) + '</div>' +
          '<div class="at">' + fmtTime(c.ts) + ' に記録</div></div>' +
        '</div>' +
        (c.note ? '<div class="note">' + esc(c.note) + '</div>' : '') +
        (c.photo ? '<img class="photo" src="' + c.photo + '" alt="駐車位置の写真">' : '') +
        '<div class="row">' +
          mapBtn +
          '<button class="btn ghost" data-act="edit-park">✏️ 編集</button>' +
        '</div>' +
        '<button class="btn danger clear-btn" data-act="clear">🚗 クリア（出庫）</button>' +
      '</section>';
  }

  function historyHtml(){
    if (!db.history || db.history.length === 0) return '';
    var html = '<div class="hist-h">履歴</div>';
    for (var i = 0; i < db.history.length; i++){
      var r = db.history[i];
      html +=
        '<div class="hist-item">' +
          (r.photo ? '<img class="h-thumb" src="' + r.photo + '" alt="">' : '<span class="h-ic">🅿️</span>') +
          '<div class="h-main">' +
            '<div class="h-note">' + (r.note ? esc(r.note) : "（メモなし）") + '</div>' +
            '<div class="h-time">' + fmtTime(r.ts) + '</div>' +
          '</div>' +
          (hasLoc(r) ? '<a class="h-map" href="' + mapUrl(r) + '" target="_blank" rel="noopener" aria-label="地図で開く">🗺️</a>' : '') +
        '</div>';
    }
    return html;
  }

  function emptyHtml(){
    return '' +
      '<div class="empty-state">' +
        '<div class="em">🅿️</div>' +
        '<h2>クルマの場所を記録</h2>' +
        '<p>停めたらワンタップ。メモ・現在地・写真を残して、あとで迷わず戻れます。</p>' +
      '</div>' +
      '<button class="bigbtn" data-act="park">🅿️ ここに停めた</button>';
  }

  function render(){
    if (db.current){
      listEl.innerHTML = currentHtml() + historyHtml();
      fabEl.style.display = "flex";
    } else {
      listEl.innerHTML = emptyHtml();
      fabEl.style.display = "none";
    }
  }

  /* ---------- modal plumbing ---------- */
  var overlay = document.getElementById("overlay");
  var sheet = document.getElementById("sheet");
  function openSheet(html){ sheet.innerHTML = '<div class="grip"></div>' + html; overlay.classList.add("on"); }
  function closeSheet(){ overlay.classList.remove("on"); }
  overlay.addEventListener("click", function(e){ if (e.target === overlay) closeSheet(); });

  /* ---------- record form ---------- */
  var form = { note: "", lat: null, lng: null, photo: null };

  function parkForm(editing){
    form = { note: "", lat: null, lng: null, photo: null };
    if (editing && db.current){
      form.note = db.current.note || "";
      form.lat = db.current.lat;
      form.lng = db.current.lng;
      form.photo = db.current.photo || null;
    }
    var geoInit = (form.lat != null)
      ? '<div class="status ok" id="geo-status">✅ 取得済み（' + Number(form.lat).toFixed(5) + ", " + Number(form.lng).toFixed(5) + '）</div>'
      : '<div class="status" id="geo-status"></div>';
    var photoInit = form.photo ? '<img class="thumb" id="photo-preview" src="' + form.photo + '" alt="写真プレビュー">' : '<div id="photo-preview"></div>';
    openSheet(
      '<h3>' + (editing ? "駐車メモを編集" : "ここに停めた場所") + '</h3>' +
      '<div class="field"><label>メモ（階・区画・目印など）</label>' +
        '<textarea id="f-note" maxlength="200" placeholder="例：B2 F-24 エレベーター前">' + esc(form.note) + '</textarea></div>' +
      '<div class="field"><label>位置情報</label>' +
        '<button class="filebtn" data-act="geo">📍 現在地を取得</button>' +
        geoInit + '</div>' +
      '<div class="field"><label>写真</label>' +
        '<label class="filebtn">📷 写真を選ぶ<input type="file" id="f-photo" accept="image/*" capture="environment" style="display:none"></label>' +
        photoInit + '</div>' +
      '<div class="row">' +
        '<button class="btn ghost" data-act="close">キャンセル</button>' +
        '<button class="btn primary" data-act="' + (editing ? "save-edit-park" : "save-park") + '">保存</button>' +
      '</div>'
    );
    var fp = document.getElementById("f-photo");
    if (fp) fp.addEventListener("change", handlePhoto);
    if (!editing){ setTimeout(function(){ var n = document.getElementById("f-note"); if (n) n.focus(); }, 60); }
  }

  function handlePhoto(ev){
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var max = 1000, w = img.width, h = img.height;
        if (w >= h){ if (w > max){ h = Math.round(h * max / w); w = max; } }
        else { if (h > max){ w = Math.round(w * max / h); h = max; } }
        var cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        try{ form.photo = cv.toDataURL("image/jpeg", 0.7); }catch(e){ return; }
        var pv = document.getElementById("photo-preview");
        if (pv){
          var out = '<img class="thumb" id="photo-preview" src="' + form.photo + '" alt="写真プレビュー">';
          pv.outerHTML = out;
        }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function grabLocation(){
    var st = document.getElementById("geo-status");
    if (st){ st.className = "status"; st.textContent = "取得中…"; }
    if (!navigator.geolocation){ if (st){ st.textContent = ""; } return; }
    navigator.geolocation.getCurrentPosition(function(pos){
      form.lat = pos.coords.latitude;
      form.lng = pos.coords.longitude;
      var s = document.getElementById("geo-status");
      if (s){ s.className = "status ok"; s.innerHTML = "✅ 取得しました（" + form.lat.toFixed(5) + ", " + form.lng.toFixed(5) + "）"; }
    }, function(){
      var s = document.getElementById("geo-status");
      if (s){ s.className = "status"; s.textContent = ""; } /* 失敗時は静かに無視 */
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
  }

  /* ---------- settings ---------- */
  function settingsSheet(){
    var histN = (db.history && db.history.length) || 0;
    openSheet(
      '<h3>設定</h3>' +
      '<button class="list-item" data-act="export"><span class="ic">⬇️</span>データを書き出す (JSON)</button>' +
      '<button class="list-item danger" data-act="wipe"><span class="ic">🗑️</span>すべてのデータを削除</button>' +
      '<div class="about" style="margin-top:16px">' +
        '<p><b>とめた場所メモ</b> ' + (db.current ? "駐車中" : "未記録") + ' / 履歴 ' + histN + ' 件</p>' +
        '<p>位置情報と写真を含むすべてのデータは、この端末内にのみ保存され、外部へ送信されません。' +
        '<a href="../../privacy-parking-memo.html">プライバシーポリシー</a></p>' +
        '<p style="opacity:.7">ver 1.0.0</p>' +
      '</div>'
    );
  }

  /* ---------- actions ---------- */
  document.body.addEventListener("click", function(ev){
    var el = ev.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");

    switch(act){
      case "park": parkForm(false); break;
      case "edit-park": parkForm(true); break;
      case "geo": grabLocation(); break;
      case "close": closeSheet(); break;
      case "settings": settingsSheet(); break;

      case "save-park": {
        var note = (document.getElementById("f-note").value || "").trim();
        var rec = { note: note, lat: form.lat, lng: form.lng, photo: form.photo, ts: Date.now() };
        if (db.current){
          db.history.unshift(db.current);
          if (db.history.length > MAX_HIST) db.history = db.history.slice(0, MAX_HIST);
        }
        db.current = rec;
        save(); closeSheet(); render();
        break;
      }
      case "save-edit-park": {
        if (db.current){
          db.current.note = (document.getElementById("f-note").value || "").trim();
          db.current.lat = form.lat;
          db.current.lng = form.lng;
          db.current.photo = form.photo;
          save();
        }
        closeSheet(); render();
        break;
      }
      case "clear": {
        if (db.current && confirm("この駐車記録をクリアします（出庫）。履歴には残ります。よろしいですか？")){
          db.history.unshift(db.current);
          if (db.history.length > MAX_HIST) db.history = db.history.slice(0, MAX_HIST);
          db.current = null;
          save(); render();
        }
        break;
      }
      case "export": {
        var blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = "tometa-basho-backup-" + todayStr() + ".json";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
        break;
      }
      case "wipe": {
        if (confirm("駐車記録と履歴をすべて削除します。元に戻せません。よろしいですか？")){
          db = { version: 1, current: null, history: [] };
          save(); closeSheet(); render();
        }
        break;
      }
    }
  });

  /* ---------- boot ---------- */
  render();
  /* 経過時間ラベルを1分ごとに更新 */
  setInterval(function(){ if (db.current && !overlay.classList.contains("on")) render(); }, 60000);

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }

  window.__parking = { sinceLabel: sinceLabel, fmtTime: fmtTime, todayStr: todayStr };
})();
</script>
</body>
</html>
